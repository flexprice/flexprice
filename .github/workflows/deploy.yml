name: Build, Push & Deploy to AWS ECS

on:
  push:
    # develop builds + publishes the GHCR :develop image only; no ECS deploy
    # (staging ECS is deprovisioned). main runs the full production pipeline.
    branches: [develop, main]
    tags: ['v*']
  # Manual trigger: lets you validate config or force-deploy without a push
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        type: choice
        default: production
        options: [production]
      dry_run:
        description: "Dry run — validate config & print plan, skip register/deploy"
        type: boolean
        default: false
      skip_migrations:
        description: "Skip database migrations for this run (deploy code only)"
        type: boolean
        default: false

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read
  packages: write

env:
  ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  GHCR_IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Job 1: Build the Docker image and push it to GHCR
  # Skipped on dry-run dispatches (no code change, no reason to rebuild)
  # ──────────────────────────────────────────────────────────────────────────
  build:
    name: Build & Push Docker Image
    runs-on: self-hosted
    if: ${{ github.event.inputs.dry_run != 'true' }}
    outputs:
      image: ${{ steps.set-image.outputs.image }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Login to GitHub Container Registry
        # Best-effort on non-main branches; REQUIRED on main — GCP prod deploys off
        # the GHCR :<sha> this pushes (promoted to :main post-approval), so a GHCR
        # failure on main must fail the build, not slip through silently.
        continue-on-error: ${{ github.ref_name != 'main' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ vars.GHCR_USERNAME || github.actor }}
          password: ${{ secrets.GHCR_PUBLISH_TOKEN }}

      - name: Prepare image tags
        id: image-tag
        env:
          GHCR_IMAGE: ${{ env.GHCR_IMAGE }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          IS_DEVELOP="${{ github.ref_name == 'develop' }}"
          IS_MAIN="${{ github.ref_name == 'main' }}"
          IS_DEVELOP="${{ github.ref_name == 'develop' }}"

          {
            echo "ghcr_tags<<TAGS_EOF"
            echo "${GHCR_IMAGE}:${GITHUB_SHA}"
            if [ "$IS_RELEASE" = "true" ]; then
              echo "${GHCR_IMAGE}:${GITHUB_REF_NAME}"
              echo "${GHCR_IMAGE}:latest"
            elif [ "$IS_DEVELOP" = "true" ]; then
              echo "${GHCR_IMAGE}:develop"
            # NOTE: on main we intentionally do NOT push :main here. The build job
            # publishes only the immutable :<sha> tag. The :main tag — which the GCP
            # ArgoCD image-updater watches — is promoted in the 'promote-main-ghcr'
            # job AFTER the prod-approval gate, so GCP prod deploys only post-approval
            # (matching the AWS ECS rollout). See that job below.
            fi
            echo "TAGS_EOF"
          } >> $GITHUB_OUTPUT

          if [ "$IS_RELEASE" = "true" ] || [ "$IS_MAIN" = "true" ] || [ "$IS_DEVELOP" = "true" ]; then
            echo "platforms=linux/amd64,linux/arm64" >> $GITHUB_OUTPUT
          else
            echo "platforms=linux/arm64" >> $GITHUB_OUTPUT
          fi

      - name: Build & push image to GHCR
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile
          platforms: ${{ steps.image-tag.outputs.platforms }}
          push: true
          tags: ${{ steps.image-tag.outputs.ghcr_tags }}
          provenance: false
          # Shared layer cache in GHCR (both AWS + GCP self-hosted runners reach it).
          cache-from: type=registry,ref=${{ env.GHCR_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.GHCR_IMAGE }}:buildcache,mode=max

      - name: Set image output
        id: set-image
        env:
          GHCR_IMAGE: ${{ env.GHCR_IMAGE }}
          GITHUB_SHA: ${{ github.sha }}
        run: echo "image=${GHCR_IMAGE}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

  # ──────────────────────────────────────────────────────────────────────────
  # Job 2: Resolve deployment targets (production only)
  #
  # Targets are stored as a single JSON variable per environment so that
  # each region can have its own cluster and service names:
  #
  #   PROD_DEPLOY_TARGETS
  #   (GitHub Actions → Settings → Variables)
  #
  #   Format (one object per region):
  #   [
  #     {
  #       "region":           "ap-south-1",
  #       "cluster":          "fp-prod-backend",
  #       "api_service":      "flexprice-api-v4",
  #       "consumer_service": "flexprice-consumer-v1",
  #       "worker_service":   "temporal-worker",
  #       "preprod_service":  "preprod-flexprice-api-service"
  #     },
  #     {
  #       "region":           "us-west-2",
  #       "cluster":          "prod-flexprice-v1",
  #       "api_service":      "prod-flexprice-v1",
  #       "consumer_service": "flexprice-consumer-v1",
  #       "worker_service":   "flexprice-temporal-worker-v1"
  #     }
  #   ]
  #
  #   preprod_service (optional): canary ECS service in the SAME cluster/region.
  #   Targets that define it are deployed to preprod first; production rollout
  #   then waits for manual approval (GitHub Environment: prod-approval).
  #
  #   Trigger mapping (staging ECS deprovisioned — production only):
  #     push to main      → production targets
  #     workflow_dispatch → production targets
  # ──────────────────────────────────────────────────────────────────────────
  resolve-config:
    name: Resolve deployment targets
    # develop only builds/publishes the GHCR image (staging ECS deprovisioned).
    # Skipping here cascades: every deploy job needs this one, so none run.
    if: ${{ github.ref_name != 'develop' }}
    runs-on: self-hosted
    outputs:
      targets: ${{ steps.config.outputs.targets }}
      preprod_targets: ${{ steps.config.outputs.preprod_targets }}
      environment: ${{ steps.config.outputs.environment }}
      dry_run: ${{ steps.config.outputs.dry_run }}

    steps:
      - name: Select targets based on input
        id: config
        env:
          PROD_TARGETS: ${{ vars.PROD_DEPLOY_TARGETS }}
        run: |
          # Only production targets exist (staging ECS deprovisioned).
          ENV="production"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Default dry_run to false when not explicitly set
            DRY_RUN="${{ github.event.inputs.dry_run }}"
            if [ -z "$DRY_RUN" ]; then DRY_RUN="false"; fi
          else
            DRY_RUN="false"
          fi

          echo "Environment and dry_run configured (values redacted for public logs)"

          TARGETS_JSON="$PROD_TARGETS"

          # Targets that also define a preprod_service get a canary deploy +
          # manual approval gate before the full production rollout.
          if [ -z "$TARGETS_JSON" ]; then
            PREPROD_TARGETS_JSON="[]"
          else
            PREPROD_TARGETS_JSON=$(echo "$TARGETS_JSON" | python3 -c "
          import json, sys
          targets = json.load(sys.stdin)
          print(json.dumps([t for t in targets if t.get('preprod_service')]))
          ")
          fi

          # Use delimiter format so JSON (newlines, spaces) is written correctly to GITHUB_OUTPUT
          echo "targets<<TARGETS_EOF" >> $GITHUB_OUTPUT
          echo "$TARGETS_JSON" >> $GITHUB_OUTPUT
          echo "TARGETS_EOF" >> $GITHUB_OUTPUT

          echo "preprod_targets<<PREPROD_EOF" >> $GITHUB_OUTPUT
          echo "$PREPROD_TARGETS_JSON" >> $GITHUB_OUTPUT
          echo "PREPROD_EOF" >> $GITHUB_OUTPUT

          echo "environment=$ENV" >> $GITHUB_OUTPUT
          echo "dry_run=$DRY_RUN" >> $GITHUB_OUTPUT

      # A skipped job cannot report why it was skipped -- it simply is not in the
      # run. Without this, "this deploy shipped code without running migrations"
      # is invisible to anyone reading the run afterwards.
      - name: Record whether migrations will run
        if: always()
        env:
          ENABLED: ${{ vars.DB_MIGRATIONS_ENABLED }}
          SKIPPED: ${{ github.event.inputs.skip_migrations }}
        run: |
          if [ "$ENABLED" = "true" ] && [ "$SKIPPED" != "true" ]; then
            echo "### Database migrations: ENABLED" >> "$GITHUB_STEP_SUMMARY"
            echo "The migrate job runs before any rollout and blocks it on failure." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### :warning: Database migrations: NOT RUNNING" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            if [ "$SKIPPED" = "true" ]; then
              echo "Skipped for this run via the \`skip_migrations\` input." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "\`DB_MIGRATIONS_ENABLED\` is not \`true\` (currently: \`${ENABLED:-unset}\`)." >> "$GITHUB_STEP_SUMMARY"
            fi
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "This deployment ships code without applying schema changes. If this" >> "$GITHUB_STEP_SUMMARY"
            echo "release contains a migration, apply it by hand or the new code runs" >> "$GITHUB_STEP_SUMMARY"
            echo "against the old schema." >> "$GITHUB_STEP_SUMMARY"
          fi

  # ──────────────────────────────────────────────────────────────────────────
  # Job 3: Database migrations — one ECS task per target, before anything rolls.
  #
  # Runs ahead of the preprod canary and therefore ahead of the production
  # approval gate. That is deliberate: the canary runs the NEW image, so the new
  # schema has to be there before it starts. It is only safe because migrations
  # are additive and backward-compatible by rule (migrations/versioned/README.md)
  # — the running old code keeps working against the migrated schema, and a
  # rejected approval leaves a schema the old image still runs on.
  #
  # A failure here blocks every deploy job below. The database is left at the
  # last migration that reported Applied: dbmate commits one file at a time, so
  # a partial run is a known prefix of the timeline, never a half-applied file.
  # ──────────────────────────────────────────────────────────────────────────
  migrate:
    name: Migrate Database (${{ strategy.job-index }})
    needs: [build, resolve-config]
    # OFF unless DB_MIGRATIONS_ENABLED is exactly "true". Default-off is
    # deliberate while migrations are still applied by hand: turning this on is
    # a decision someone makes per environment, after the target database has
    # been adopted (`make migrate-adopt`). An unadopted database fails the Job
    # on purpose, which would block deploys.
    #
    # Set at Settings > Secrets and variables > Actions > Variables, or
    #   gh variable set DB_MIGRATIONS_ENABLED --body true
    #
    # `vars` and not `env`: the env context is not available in a job-level `if`.
    if: >-
      ${{ always() &&
          vars.DB_MIGRATIONS_ENABLED == 'true' &&
          github.event.inputs.skip_migrations != 'true' &&
          needs.build.result == 'success' &&
          needs.resolve-config.result == 'success' &&
          needs.resolve-config.outputs.targets != '[]' }}
    runs-on: self-hosted
    strategy:
      matrix:
        target: ${{ fromJson(needs.resolve-config.outputs.targets) }}
      # One target's database failing must not leave the others half-deployed:
      # let every migration report, then block the rollout on any failure.
      fail-fast: false
      max-parallel: 3

    steps:
      # Checkout runs BEFORE credentials are configured: configure-aws-credentials
      # exports the migration role's temporary credentials into the environment of
      # every subsequent step, and checkout has no need of them.
      #
      # Both actions are pinned to a commit SHA rather than a tag. A tag can be
      # repointed by its owner (see the trivy-action and kics-github-action
      # compromises); the rest of this workflow predates that rule.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-cicd
          aws-region: ${{ matrix.target.region }}

      - name: Apply database migrations
        uses: ./.github/actions/run-ecs-migration
        with:
          cluster: ${{ matrix.target.cluster }}
          region: ${{ matrix.target.region }}
          service_name: ${{ matrix.target.api_service }}
          image: ${{ needs.build.outputs.image || format('{0}:{1}', env.GHCR_IMAGE, github.sha) }}
          ecr_repo_prefix: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}
          ghcr_repo_prefix: ${{ env.GHCR_IMAGE }}
          ghcr_credentials_arn: ${{ vars.ECS_GHCR_PULL_CREDENTIALS_ARN }}
          dry_run: ${{ needs.resolve-config.outputs.dry_run }}

  # ──────────────────────────────────────────────────────────────────────────
  # Job 3: Canary — deploy preprod service(s) for targets that define one.
  # Runs BEFORE the approval gate; production rollout only proceeds after a
  # human validates these preprod deployments and approves the gate.
  # Skipped entirely when no target defines preprod_service.
  # ──────────────────────────────────────────────────────────────────────────
  deploy-preprod:
    name: Deploy Preprod (${{ strategy.job-index }})
    needs: [build, resolve-config, migrate]
    # `always()` is required so a skipped approval-gate does not block the run, but it
    # also cancels the implicit "skip on failed needs" rule — so every dependency this
    # job actually relies on must be asserted explicitly. `needs.build.result` is the
    # one that matters: without it a failed image build still reaches the deploy step,
    # which registers a task definition referencing an image that was never pushed.
    if: >-
      ${{ always() &&
          needs.build.result == 'success' &&
          needs.resolve-config.result == 'success' &&
          (needs.migrate.result == 'success' || needs.migrate.result == 'skipped') &&
          needs.resolve-config.outputs.preprod_targets != '[]' }}
    runs-on: self-hosted
    strategy:
      matrix:
        target: ${{ fromJson(needs.resolve-config.outputs.preprod_targets) }}
      fail-fast: false
      max-parallel: 3

    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-cicd
          aws-region: ${{ matrix.target.region }}

      - name: Deploy ECS Preprod service
        uses: ./.github/actions/deploy-ecs-service
        with:
          cluster: ${{ matrix.target.cluster }}
          region: ${{ matrix.target.region }}
          service_name: ${{ matrix.target.preprod_service }}
          image: ${{ needs.build.outputs.image || format('{0}:{1}', env.GHCR_IMAGE, github.sha) }}
          ecr_repo_prefix: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}
          ghcr_repo_prefix: ${{ env.GHCR_IMAGE }}
          ghcr_credentials_arn: ${{ vars.ECS_GHCR_PULL_CREDENTIALS_ARN }}
          dry_run: ${{ needs.resolve-config.outputs.dry_run }}

  # ──────────────────────────────────────────────────────────────────────────
  # Job 4: Manual approval gate (production only).
  # Bound to the GitHub Environment `prod-approval` whose required-reviewers
  # protection rule pauses the run here until a reviewer approves.
  # - Runs only for production, after preprod deploys succeed.
  # - 'skipped' preprod is also accepted so a prod config with no preprod
  #   services still gates + deploys instead of silently doing nothing.
  # - Dry runs bypass the gate (nothing is registered/deployed anyway).
  # Setup runbook: docs/deployment/preprod-approval-gate.md
  # ──────────────────────────────────────────────────────────────────────────
  approval-gate:
    name: Approve production rollout
    needs: [resolve-config, deploy-preprod]
    if: >-
      ${{ always() &&
          needs.resolve-config.result == 'success' &&
          needs.resolve-config.outputs.environment == 'production' &&
          needs.resolve-config.outputs.dry_run != 'true' &&
          (needs.deploy-preprod.result == 'success' || needs.deploy-preprod.result == 'skipped') }}
    runs-on: self-hosted
    environment: prod-approval

    steps:
      - name: Production rollout approved
        run: |
          echo "Preprod canary validated and production rollout approved."
          echo "Proceeding to deploy api, consumer and worker services to all production targets."

  # ──────────────────────────────────────────────────────────────────────────
  # Promote the GHCR :main tag — THIS is what unblocks GCP. It has its OWN
  # approval gate (GitHub Environment `gcp-prod-approval`), SEPARATE from the AWS
  # `prod-approval` gate — so AWS and GCP are approved independently (two prompts).
  # GCP prod (ArgoCD image-updater) watches ghcr.io/<repo>:main. The build job
  # published only the immutable :<sha>; after a reviewer approves the GCP gate we
  # retag :<sha> -> :main (manifest-only, no rebuild), so GCP deploys only
  # post-approval. Runs after the preprod canary (like the AWS gate); production +
  # non-dry-run only.
  #
  # SETUP (required): create the `gcp-prod-approval` Environment in repo Settings →
  # Environments with required reviewers (mirror `prod-approval`) — otherwise the
  # gate does not pause. See docs/deployment/preprod-approval-gate.md.
  # ──────────────────────────────────────────────────────────────────────────
  promote-main-ghcr:
    name: Approve & promote :main to GHCR (GCP prod)
    needs: [build, resolve-config, deploy-preprod]
    if: >-
      ${{ always() &&
          needs.build.result == 'success' &&
          needs.resolve-config.result == 'success' &&
          needs.resolve-config.outputs.environment == 'production' &&
          needs.resolve-config.outputs.dry_run != 'true' &&
          (needs.deploy-preprod.result == 'success' || needs.deploy-preprod.result == 'skipped') }}
    runs-on: self-hosted
    environment: gcp-prod-approval
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ vars.GHCR_USERNAME || github.actor }}
          password: ${{ secrets.GHCR_PUBLISH_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Retag :<sha> -> :main (manifest copy, no rebuild)
        env:
          GHCR_IMAGE: ${{ env.GHCR_IMAGE }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          # imagetools uses Docker's OWN auth (the docker/login-action step above) — the
          # exact path the build job uses to push to GHCR, so no anonymous/DENIED issue.
          # It COPIES the multi-arch manifest that passed the preprod canary from :<sha>
          # to :main — no rebuild, and :main lands on the identical digest that was tested.
          docker buildx imagetools create \
            --tag "${GHCR_IMAGE}:main" \
            "${GHCR_IMAGE}:${GITHUB_SHA}"

  # ──────────────────────────────────────────────────────────────────────────
  # Jobs 5a–5c: Deploy API, Consumer, Worker — one job per service type,
  # each with matrix over targets (regions). Runs in parallel for faster deploys
  # and smaller, trackable steps. max-parallel limits concurrent load on runners.
  #
  # Each target matrix entry: region, cluster, api_service, consumer_service, worker_service.
  # Task definition family is derived at runtime from the ECS service.
  # DRY RUN: composite action prints plan only, no register/update-service.
  # ──────────────────────────────────────────────────────────────────────────
  deploy-api:
    name: Deploy API (${{ strategy.job-index }})
    needs: [build, resolve-config, migrate, approval-gate]
    # production: requires the approval-gate to have been approved
    # dry-run: bypasses the gate; composite action prints plan only
    if: >-
      ${{ always() &&
          needs.build.result == 'success' &&
          needs.resolve-config.result == 'success' &&
          (needs.migrate.result == 'success' || needs.migrate.result == 'skipped') &&
          (needs.resolve-config.outputs.environment != 'production' ||
           needs.resolve-config.outputs.dry_run == 'true' ||
           needs.approval-gate.result == 'success') }}
    runs-on: self-hosted
    strategy:
      matrix:
        target: ${{ fromJson(needs.resolve-config.outputs.targets) }}
      fail-fast: false
      max-parallel: 3

    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-cicd
          aws-region: ${{ matrix.target.region }}

      - name: Deploy ECS API service
        uses: ./.github/actions/deploy-ecs-service
        with:
          cluster: ${{ matrix.target.cluster }}
          region: ${{ matrix.target.region }}
          service_name: ${{ matrix.target.api_service }}
          image: ${{ needs.build.outputs.image || format('{0}:{1}', env.GHCR_IMAGE, github.sha) }}
          ecr_repo_prefix: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}
          ghcr_repo_prefix: ${{ env.GHCR_IMAGE }}
          ghcr_credentials_arn: ${{ vars.ECS_GHCR_PULL_CREDENTIALS_ARN }}
          dry_run: ${{ needs.resolve-config.outputs.dry_run }}

  deploy-consumer:
    name: Deploy Consumer (${{ strategy.job-index }})
    needs: [build, resolve-config, migrate, approval-gate]
    # production: requires the approval-gate to have been approved
    # dry-run: bypasses the gate; composite action prints plan only
    if: >-
      ${{ always() &&
          needs.build.result == 'success' &&
          needs.resolve-config.result == 'success' &&
          (needs.migrate.result == 'success' || needs.migrate.result == 'skipped') &&
          (needs.resolve-config.outputs.environment != 'production' ||
           needs.resolve-config.outputs.dry_run == 'true' ||
           needs.approval-gate.result == 'success') }}
    runs-on: self-hosted
    strategy:
      matrix:
        target: ${{ fromJson(needs.resolve-config.outputs.targets) }}
      fail-fast: false
      max-parallel: 3

    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-cicd
          aws-region: ${{ matrix.target.region }}

      - name: Deploy ECS Consumer service
        uses: ./.github/actions/deploy-ecs-service
        with:
          cluster: ${{ matrix.target.cluster }}
          region: ${{ matrix.target.region }}
          service_name: ${{ matrix.target.consumer_service }}
          image: ${{ needs.build.outputs.image || format('{0}:{1}', env.GHCR_IMAGE, github.sha) }}
          ecr_repo_prefix: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}
          ghcr_repo_prefix: ${{ env.GHCR_IMAGE }}
          ghcr_credentials_arn: ${{ vars.ECS_GHCR_PULL_CREDENTIALS_ARN }}
          dry_run: ${{ needs.resolve-config.outputs.dry_run }}

  deploy-worker:
    name: Deploy Worker (${{ strategy.job-index }})
    needs: [build, resolve-config, migrate, approval-gate]
    # production: requires the approval-gate to have been approved
    # dry-run: bypasses the gate; composite action prints plan only
    if: >-
      ${{ always() &&
          needs.build.result == 'success' &&
          needs.resolve-config.result == 'success' &&
          (needs.migrate.result == 'success' || needs.migrate.result == 'skipped') &&
          (needs.resolve-config.outputs.environment != 'production' ||
           needs.resolve-config.outputs.dry_run == 'true' ||
           needs.approval-gate.result == 'success') }}
    runs-on: self-hosted
    strategy:
      matrix:
        target: ${{ fromJson(needs.resolve-config.outputs.targets) }}
      fail-fast: false
      max-parallel: 3

    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-cicd
          aws-region: ${{ matrix.target.region }}

      - name: Deploy ECS Worker service
        uses: ./.github/actions/deploy-ecs-service
        with:
          cluster: ${{ matrix.target.cluster }}
          region: ${{ matrix.target.region }}
          service_name: ${{ matrix.target.worker_service }}
