# On every push to develop, publish the TypeScript SDK to the SDK repo's develop branch and to npm as @flexprice/sdk@dev.

name: Generate Dev TypeScript SDK

on:
  push:
    branches: [develop]

concurrency:
  group: sdk-dev-typescript
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      SPEAKEASY_API_KEY: ${{ secrets.SPEAKEASY_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Cache Go build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ runner.os }}-

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27.2"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Resolve dev version
        id: version
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          LATEST=$(npm view @flexprice/sdk@latest version)
          if ! [[ "$LATEST" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Unexpected latest version of @flexprice/sdk on npm: $LATEST"
            exit 1
          fi
          VERSION="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3] + 1))-dev.${RUN_NUMBER}"
          echo "Dev version $VERSION (npm latest $LATEST)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Generate OpenAPI spec
        run: make swagger

      - name: Install Speakeasy CLI
        env:
          GITHUB_TOKEN: ${{ github.token }}
        # nosemgrep: yaml.github-actions.security.gha-curl-pipe-shell.gha-curl-pipe-shell
        run: |
          unset VERSION && curl -fsSL https://raw.githubusercontent.com/speakeasy-api/speakeasy/main/install.sh | sh

      # Speakeasy uploads code samples whenever they are enabled, whatever the run flags say.
      - name: Turn off code sample uploads
        run: yq -i 'del(.targets[].codeSamples)' .speakeasy/workflow.yaml

      - name: Generate TypeScript SDK
        env:
          SDK_VERSION: ${{ steps.version.outputs.version }}
        run: |
          ./scripts/sync-sdk-version-to-gen.sh "$SDK_VERSION"
          make speakeasy-validate sync-gen-to-output
          CI=true TERM=dumb speakeasy run --target flexprice-typescript -y --skip-compile --skip-upload-spec --skip-versioning --minimal
          make merge-custom

      - name: Check TypeScript SDK
        run: make ts-sdk-check

      - name: Apply dev version to SDK artifact
        env:
          SDK_VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/force-sdk-version.sh "$SDK_VERSION"

      - name: Upload api-typescript artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: api-typescript
          path: api/typescript/

  publish:
    needs: generate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.generate.outputs.version }}
      REPO: ${{ vars.SDK_TYPESCRIPT_REPO || 'flexprice/javascript-sdk' }}
    steps:
      # Re-runs keep the run number, so skip when npm dev already has this run's build or a newer one.
      - name: Check npm dev tag
        id: devtag
        run: |
          DEV=$(npm view @flexprice/sdk dist-tags.dev)
          if [[ "$DEV" =~ -dev\.([0-9]+)$ ]] && (( BASH_REMATCH[1] >= GITHUB_RUN_NUMBER )); then
            echo "::notice::npm dev is already at ${DEV}, so ${VERSION} is not pushed or published."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout (for LICENSE)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: api-typescript
          path: api-typescript

      - name: Push SDK to develop branch
        if: steps.devtag.outputs.publish == 'true'
        env:
          SDK_DEPLOY_GIT_TOKEN: ${{ secrets.SDK_DEPLOY_GIT_TOKEN }}
        run: |
          git clone "https://x-access-token:${SDK_DEPLOY_GIT_TOKEN}@github.com/${REPO}.git" "$RUNNER_TEMP/sdk-repo"
          cd "$RUNNER_TEMP/sdk-repo"
          if git ls-remote --exit-code --heads origin develop >/dev/null; then
            git checkout develop
          else
            git checkout -b develop
          fi
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -r "$GITHUB_WORKSPACE/api-typescript/." .
          [ -f "$GITHUB_WORKSPACE/LICENSE" ] && cp "$GITHUB_WORKSPACE/LICENSE" .
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "Develop TypeScript SDK ${VERSION} (flexprice ${GITHUB_SHA::7})"
            git push origin develop
          fi
          echo "Pushed TypeScript SDK ${VERSION} to ${REPO}@develop"

      # Node 24 ships npm 11, which refuses to publish a pre-release without --tag, so a dev build can't become latest.
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Publish to npm under the dev tag
        if: steps.devtag.outputs.publish == 'true'
        working-directory: api-typescript
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::NPM_TOKEN secret is not set."
            exit 1
          fi
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> .npmrc
          npm install --ignore-scripts
          npm run build
          npm publish --access public --tag dev
