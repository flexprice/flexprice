# Generate OpenAPI spec and all SDKs (Go, TypeScript, Python) + MCP.
#
# Flow: release published -> version-check (version from release tag only) -> generate -> push to GitHub -> publish to npm/PyPI.
# Version: strictly from the release tag only (e.g. v1.2.3 -> 1.2.3). No manual input, sdk-version.json, or npm lookup. Skip when version equals .speakeasy/gen/go.yaml.
# Docs: generate uploads the spec plus the Go, Python and TypeScript code samples to the Speakeasy registry and promotes
# them to the main tag, which rebuilds https://spec.speakeasy.com/flexprice/prod/swagger-json-with-code-samples.
# refresh-docs waits for that URL to match the release, copies that file to S3 (served by CloudFront),
# then adds the release to version.mdx in the docs repo so Mintlify redeploys.
#
# Triggers: release published only. When version unchanged vs gen/go.yaml, generate and publish are skipped.
# Required secrets: SPEAKEASY_API_KEY, SDK_DEPLOY_GIT_TOKEN (fine-grained PAT: Contents R/W + Metadata Read on target SDK repos), NPM_TOKEN, PYPI_TOKEN.
# Docs redeploy: secret DOCS_REPO_TOKEN (fine-grained PAT: Contents R/W on the docs repo); optional variables DOCS_REPO
# (default flexprice/flexprice-docs) and DOCS_BRANCH (default main). refresh-docs fails when the token is unset.
# Spec copy: variable OPENAPI_SPEC_S3, JSON {"role", "region", "bucket", "distribution", "url"}; skipped while unset.
# When set, secret AWS_ACCOUNT_ID is required to construct the role ARN. The role needs
# s3:PutObject on <bucket>/openapi.json, and cloudfront:CreateInvalidation and cloudfront:GetInvalidation on the distribution.
# url is where the distribution is served, e.g. https://swagger.flexprice.io.
# Published packages: pip install flexprice | npm i @flexprice/sdk | npm i @flexprice/mcp-server
# Default SDK repos (override via SDK_GO_REPO, SDK_PYTHON_REPO, SDK_TYPESCRIPT_REPO, SDK_MCP_REPO): flexprice/go-sdk, flexprice/javascript-sdk, flexprice/python-sdk, flexprice/mcp-server.
#
# Full pipeline runs on GitHub. Local act may fail at upload-artifact unless act's artifact server is configured (ACTIONS_RUNTIME_TOKEN, ACTIONS_RUNTIME_URL, ACTIONS_RESULTS_URL).

name: Generate SDKs

on:
  release:
    types: [published]

concurrency:
  group: sdk-generate-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Version from release tag only. Skip if equals gen/go.yaml.
  # ---------------------------------------------------------------------------
  version-check:
    runs-on: ubuntu-latest
    if: |
      !github.event.release.prerelease &&
      !github.event.release.draft
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version-check.outputs.version }}
      skip: ${{ steps.version-check.outputs.skip }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set version from release tag and set outputs
        id: version-check
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          RAW="$RELEASE_TAG"
          RESOLVED="${RAW#v}"
          echo "Using release tag: $RAW -> $RESOLVED"
          if ! printf '%s' "$RESOLVED" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "::error::Invalid release tag (expected semver like v1.2.3): $RAW"
            exit 1
          fi

          GEN_VERSION=""
          if [ -f .speakeasy/gen/go.yaml ]; then
            GEN_VERSION=$(sed -n '/^go:/,/^[a-z]/p' .speakeasy/gen/go.yaml | grep 'version:' | head -1 | sed 's/.*version:[[:space:]]*//' | xargs)
          fi

          if [ "$RESOLVED" = "$GEN_VERSION" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Version unchanged (version=$RESOLVED, gen/go.yaml=$GEN_VERSION); skipping generate and publish."
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "Version: $RESOLVED (gen/go.yaml=$GEN_VERSION); will generate and publish."
          fi
          echo "version=$RESOLVED" >> $GITHUB_OUTPUT

      - name: Skip summary
        if: steps.version-check.outputs.skip == 'true'
        run: |
          echo "## Skipped generate and publish" >> $GITHUB_STEP_SUMMARY
          echo "Version matches \`.speakeasy/gen/go.yaml\`. No generation or publish." >> $GITHUB_STEP_SUMMARY

  # ---------------------------------------------------------------------------
  # Setup → OpenAPI → SDK tooling → Generate → Upload artifacts
  # ---------------------------------------------------------------------------
  generate:
    needs: version-check
    if: needs.version-check.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      promote_outcome: ${{ steps.promote.outcome }}
    env:
      SPEAKEASY_API_KEY: ${{ secrets.SPEAKEASY_API_KEY }}
    steps:
      - name: Check required secrets
        run: |
          if [ -z "${{ secrets.SPEAKEASY_API_KEY }}" ]; then
            echo "::error::SPEAKEASY_API_KEY secret is not set. Add it in repository Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "SPEAKEASY_API_KEY is set."

      # Setup
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Cache Go build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ runner.os }}-

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27.2"

      # make swagger needs Node (fix_swagger_internal_types.mjs) and Python 3 (fix_swagger_refs.sh)
      # before OpenAPI generation — not only for Speakeasy steps below.
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      # OpenAPI
      - name: Generate OpenAPI spec
        run: |
          set -euxo pipefail
          go version
          command -v node && node --version
          command -v python3 && python3 --version
          make swagger

      - name: Verify OpenAPI spec exists
        run: |
          if [ ! -f "docs/swagger/swagger-3-0.json" ]; then
            echo "ERROR: docs/swagger/swagger-3-0.json not found after make swagger"
            exit 1
          fi
          echo "OpenAPI spec size: $(wc -c < docs/swagger/swagger-3-0.json) bytes"

      # SDK tooling (Node already set up above)

      # Speakeasy install.sh uses VERSION for CLI version; our workflow sets VERSION for SDK. Unset so install fetches latest CLI.
      - name: Install Speakeasy CLI
        env:
          GITHUB_TOKEN: ${{ github.token }}
        # Vendor's official installer over HTTPS; it verifies the CLI archive
        # checksum before install. Release-pipeline only.
        # nosemgrep: yaml.github-actions.security.gha-curl-pipe-shell.gha-curl-pipe-shell
        run: |
          unset VERSION && curl -fsSL https://raw.githubusercontent.com/speakeasy-api/speakeasy/main/install.sh | sh

      # SDKs: generate with resolved version only (from version-check job).
      # Also uploads the spec and each target's code samples (codeSamples in .speakeasy/workflow.yaml) to the
      # Speakeasy registry tagged main; Speakeasy combines them into the hosted docs spec.
      - name: Generate SDKs and MCP
        env:
          SDK_VERSION: ${{ needs.version-check.outputs.version }}
        run: make sdk-all VERSION="$SDK_VERSION" SPEAKEASY_RUN_FLAGS="--skip-testing --skip-versioning --registry-tags main"

      # Tags added during upload don't make Speakeasy rebuild the hosted docs spec; tagging through
      # `speakeasy tag promote` (what Speakeasy's own GitHub Action runs) does. Non-fatal so the docs
      # can't block SDK publishing; refresh-docs checks this step's outcome and fails if it didn't succeed.
      - name: Promote spec and code samples to main
        id: promote
        continue-on-error: true
        run: speakeasy tag promote -s swagger-json -c flexprice-go,flexprice-python,flexprice-typescript -t main

      # Build and test the TypeScript SDK before anything is uploaded, pushed to GitHub or published to npm
      - name: Check TypeScript SDK
        run: make ts-sdk-check

      # Overwrite Speakeasy version in artifacts with resolved version only
      - name: Apply resolved version to SDK artifacts
        env:
          RESOLVED_VERSION: ${{ needs.version-check.outputs.version }}
        run: ./scripts/force-sdk-version.sh "$RESOLVED_VERSION"

      - name: Generate job summary
        env:
          RESOLVED_VERSION: ${{ needs.version-check.outputs.version }}
        run: |
          echo "## Generate SDKs" >> $GITHUB_STEP_SUMMARY
          echo "**Resolved version:** $RESOLVED_VERSION" >> $GITHUB_STEP_SUMMARY
          echo "**Artifacts:** api-go, api-typescript, api-python, api-mcp" >> $GITHUB_STEP_SUMMARY

      - name: Upload api-go artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: api-go
          path: api/go/

      - name: Upload api-typescript artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: api-typescript
          path: api/typescript/

      - name: Upload api-python artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: api-python
          path: api/python/

      - name: Upload api-mcp artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: api-mcp
          path: api/mcp/

      - name: Upload openapi-spec artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: openapi-spec
          path: docs/swagger/swagger-3-0.json

  # ---------------------------------------------------------------------------
  # Docs: Mintlify re-reads the hosted spec only on deploy, so wait for Speakeasy to
  # rebuild it (spec and code samples) from this release's upload, copy it to S3, then redeploy the docs.
  # ---------------------------------------------------------------------------
  refresh-docs:
    needs: [version-check, generate]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      # With an unchanged spec, the previous hosted spec would still pass the wait below, hiding a failed promote.
      - name: Check the spec and code samples were promoted
        env:
          PROMOTE_OUTCOME: ${{ needs.generate.outputs.promote_outcome }}
        run: |
          if [ "$PROMOTE_OUTCOME" != "success" ]; then
            echo "::error::Promoting the spec and code samples to main did not succeed (outcome: ${PROMOTE_OUTCOME:-unknown}); docs were not redeployed."
            exit 1
          fi

      - name: Check the S3 publication settings
        if: vars.OPENAPI_SPEC_S3 != ''
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          OPENAPI_SPEC_S3: ${{ vars.OPENAPI_SPEC_S3 }}
        run: |
          set -euo pipefail
          if ! [[ "$AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ ]]; then
            echo "::error::AWS_ACCOUNT_ID must be set to a 12-digit AWS account ID when OPENAPI_SPEC_S3 is set. Configure the secret in repository Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          for key in role region bucket distribution url; do
            if ! jq -e --arg k "$key" '(.[$k] // "") | test("\\S")' <<<"$OPENAPI_SPEC_S3" >/dev/null; then
              echo "::error::OPENAPI_SPEC_S3 is missing the \"$key\" key. It needs role, region, bucket, distribution and url."
              exit 1
            fi
          done

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download openapi-spec artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: openapi-spec
          path: release-spec

      - name: Wait for the hosted docs spec to match this release
        run: python3 scripts/wait-for-docs-spec.py release-spec/swagger-3-0.json --save "$RUNNER_TEMP/openapi.json"

      - name: Configure AWS credentials (OIDC)
        if: vars.OPENAPI_SPEC_S3 != ''
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ fromJson(vars.OPENAPI_SPEC_S3).role }}
          aws-region: ${{ fromJson(vars.OPENAPI_SPEC_S3).region }}

      # CloudFront serves openapi.json at the site root (its default root object).
      - name: Upload the spec to S3 and clear the CloudFront cache
        if: vars.OPENAPI_SPEC_S3 != ''
        env:
          OPENAPI_SPEC_S3: ${{ vars.OPENAPI_SPEC_S3 }}
        run: |
          set -euo pipefail
          BUCKET=$(jq -er .bucket <<<"$OPENAPI_SPEC_S3")
          DISTRIBUTION=$(jq -er .distribution <<<"$OPENAPI_SPEC_S3")
          aws s3 cp "$RUNNER_TEMP/openapi.json" "s3://$BUCKET/openapi.json" --only-show-errors \
            --content-type application/json --cache-control "public, max-age=300"
          INVALIDATION=$(aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION" \
            --paths /openapi.json --query Invalidation.Id --output text)
          aws cloudfront wait invalidation-completed --distribution-id "$DISTRIBUTION" --id "$INVALIDATION"

      # Two assertions: the CDN serves the bytes just uploaded (no truncation, no stale
      # cache), and those bytes still carry this release's base spec.
      - name: Check the hosted spec serves this release
        if: vars.OPENAPI_SPEC_S3 != ''
        env:
          SPEC_URL: ${{ fromJson(vars.OPENAPI_SPEC_S3).url }}
        run: |
          set -euo pipefail
          python3 scripts/wait-for-docs-spec.py "$RUNNER_TEMP/openapi.json" --url "$SPEC_URL" --exact
          python3 scripts/wait-for-docs-spec.py release-spec/swagger-3-0.json --url "$SPEC_URL" --timeout 0

      # The release is recorded as a new row in the docs repo's version.mdx.
      - name: Redeploy docs
        env:
          DOCS_REPO_TOKEN: ${{ secrets.DOCS_REPO_TOKEN }}
          DOCS_REPO: ${{ vars.DOCS_REPO || 'flexprice/flexprice-docs' }}
          DOCS_BRANCH: ${{ vars.DOCS_BRANCH || 'main' }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
        run: |
          if [ -z "$DOCS_REPO_TOKEN" ]; then
            echo "::error::DOCS_REPO_TOKEN is not set; docs were not redeployed."
            exit 1
          fi
          python3 scripts/redeploy_docs.py --repo "$DOCS_REPO" --branch "$DOCS_BRANCH" \
            --tag "$RELEASE_TAG" --release-url "$RELEASE_URL"

  # ---------------------------------------------------------------------------
  # Publish: one matrix cell per SDK/MCP (parallel push to GitHub repos)
  # ---------------------------------------------------------------------------
  publish-to-github:
    needs: [version-check, generate]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - lang: go
            artifact: api-go
            default_repo: flexprice/go-sdk
          - lang: python
            artifact: api-python
            default_repo: flexprice/python-sdk
          - lang: typescript
            artifact: api-typescript
            default_repo: flexprice/javascript-sdk
          - lang: mcp
            artifact: api-mcp
            default_repo: flexprice/mcp-server
    env:
      SDK_DEPLOY_GIT_TOKEN: ${{ secrets.SDK_DEPLOY_GIT_TOKEN }}
      SDK_GO_REPO: ${{ vars.SDK_GO_REPO }}
      SDK_PYTHON_REPO: ${{ vars.SDK_PYTHON_REPO }}
      SDK_TYPESCRIPT_REPO: ${{ vars.SDK_TYPESCRIPT_REPO }}
      SDK_MCP_REPO: ${{ vars.SDK_MCP_REPO }}
      VERSION: ${{ needs.version-check.outputs.version }}  # resolved version only
    steps:
      - name: Checkout (for LICENSE)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

      - name: Set target repo
        env:
          LANG_KEY: ${{ matrix.lang }}
          DEFAULT_REPO: ${{ matrix.default_repo }}
        run: |
          case "$LANG_KEY" in
            go)         echo "REPO=${SDK_GO_REPO:-$DEFAULT_REPO}" >> $GITHUB_ENV ;;
            python)     echo "REPO=${SDK_PYTHON_REPO:-$DEFAULT_REPO}" >> $GITHUB_ENV ;;
            typescript) echo "REPO=${SDK_TYPESCRIPT_REPO:-$DEFAULT_REPO}" >> $GITHUB_ENV ;;
            mcp)        echo "REPO=${SDK_MCP_REPO:-$DEFAULT_REPO}" >> $GITHUB_ENV ;;
          esac

      - name: Push SDK to repo
        env:
          LANG_KEY: ${{ matrix.lang }}
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          # Use resolved version only (from version-check)
          [ -z "$VERSION" ] && VERSION="0.0.0"
          git clone "https://x-access-token:${SDK_DEPLOY_GIT_TOKEN}@github.com/${REPO}.git" /tmp/sdk-repo
          cd /tmp/sdk-repo
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -r "$GITHUB_WORKSPACE/$ARTIFACT/." /tmp/sdk-repo/
          [ -f "$GITHUB_WORKSPACE/LICENSE" ] && cp "$GITHUB_WORKSPACE/LICENSE" /tmp/sdk-repo/
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "Release ${LANG_KEY} SDK v${VERSION}"
            if ! git rev-parse "v${VERSION}" >/dev/null 2>&1; then
              git tag -a "v${VERSION}" -m "${LANG_KEY} SDK version ${VERSION}"
            fi
            git push origin main
            git push origin "v${VERSION}" 2>/dev/null || true
          fi
          echo "Pushed ${LANG_KEY} SDK to ${REPO}"

      - name: Create Go SDK GitHub release
        if: matrix.lang == 'go'
        env:
          GH_TOKEN: ${{ secrets.SDK_DEPLOY_GIT_TOKEN }}
        run: |
          [ -z "$VERSION" ] && VERSION="0.0.0"
          TAG="v${VERSION}"
          TITLE="Go SDK ${TAG}"

          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release $TAG already exists in $REPO; skipping."
          else
            gh release create "$TAG" \
              --repo "$REPO" \
              --title "$TITLE" \
              --notes "Automated release for Go SDK ${TAG}."
            echo "Created release $TAG in $REPO."
          fi

  # ---------------------------------------------------------------------------
  # Summary (runs once after all publish matrix cells)
  # ---------------------------------------------------------------------------
  publish-summary:
    needs: [version-check, generate, publish-to-github]
    if: success() && github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SDK_GO_REPO: ${{ vars.SDK_GO_REPO }}
      SDK_PYTHON_REPO: ${{ vars.SDK_PYTHON_REPO }}
      SDK_TYPESCRIPT_REPO: ${{ vars.SDK_TYPESCRIPT_REPO }}
      SDK_MCP_REPO: ${{ vars.SDK_MCP_REPO }}
      VERSION: ${{ needs.version-check.outputs.version }}  # resolved version only
    steps:
      - name: Summary
        run: |
          GO_REPO="${SDK_GO_REPO:-flexprice/go-sdk}"
          PY_REPO="${SDK_PYTHON_REPO:-flexprice/python-sdk}"
          TS_REPO="${SDK_TYPESCRIPT_REPO:-flexprice/javascript-sdk}"
          MCP_REPO="${SDK_MCP_REPO:-flexprice/mcp-server}"
          echo "## SDKs pushed to GitHub" >> $GITHUB_STEP_SUMMARY
          echo "**Resolved version:** v${VERSION}" >> $GITHUB_STEP_SUMMARY
          echo "- Go: https://github.com/$GO_REPO" >> $GITHUB_STEP_SUMMARY
          echo "- Python: https://github.com/$PY_REPO" >> $GITHUB_STEP_SUMMARY
          echo "- TypeScript: https://github.com/$TS_REPO" >> $GITHUB_STEP_SUMMARY
          echo "- MCP: https://github.com/$MCP_REPO" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Install (published packages)" >> $GITHUB_STEP_SUMMARY
          echo "- **Python:** \`pip install flexprice\`" >> $GITHUB_STEP_SUMMARY
          echo "- **TypeScript:** \`npm i @flexprice/sdk\`" >> $GITHUB_STEP_SUMMARY
          echo "- **MCP:** \`npm i @flexprice/mcp-server\`" >> $GITHUB_STEP_SUMMARY

  # ---------------------------------------------------------------------------
  # Publishes via npm/twine here; .speakeasy/workflow.yaml publish config is for Speakeasy CLI/action only and is not used by this workflow.
  # ---------------------------------------------------------------------------
  publish-to-registries:
    needs: [generate, publish-to-github]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - lang: typescript
            artifact: api-typescript
          - lang: python
            artifact: api-python
          - lang: mcp
            artifact: api-mcp
    steps:
      - name: Download artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ matrix.artifact }}
          path: sdk

      - name: Show package name (npm/PyPI)
        run: |
          if [ -f sdk/package.json ]; then
            echo "package.json name: $(jq -r .name sdk/package.json)"
            echo "package.json version: $(jq -r .version sdk/package.json)"
          fi
          if [ -f sdk/pyproject.toml ]; then
            echo "pyproject.toml: $(grep -E '^name\s*=' sdk/pyproject.toml || true)"
          fi

      - name: Set up Node (TypeScript)
        if: matrix.lang == 'typescript'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Publish TypeScript to npm
        if: matrix.lang == 'typescript'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::NPM_TOKEN secret is not set. Add it in repository Secrets or in .secrets for act."
            exit 1
          fi
          cd sdk
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> .npmrc
          npm install --ignore-scripts
          npm run build
          npm publish --access public

      - name: Publish MCP to npm
        if: matrix.lang == 'mcp'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::NPM_TOKEN secret is not set. Add it in repository Secrets or in .secrets for act."
            exit 1
          fi
          cd sdk
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> .npmrc
          npm install --ignore-scripts
          [ -f node_modules/bun/install.js ] && node node_modules/bun/install.js || true
          NODE_ENV=production npm run build
          NODE_ENV=production npm publish --access public

      - name: Set up Python
        if: matrix.lang == 'python'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Publish Python to PyPI
        if: matrix.lang == 'python'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          cd sdk
          python -m pip install --upgrade pip build twine
          python -m build
          twine upload dist/*

  # ---------------------------------------------------------------------------
  # MCP server image, then AWS deploy
  # ---------------------------------------------------------------------------
  publish-mcp-image:
    needs: [version-check, publish-to-registries]
    if: github.event_name == 'release'
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/publish-mcp-image.yml
    with:
      version: ${{ needs.version-check.outputs.version }}
    secrets:
      GHCR_PUBLISH_TOKEN: ${{ secrets.GHCR_PUBLISH_TOKEN }}

  deploy-mcp-aws:
    name: Deploy MCP server to AWS (CodePipeline)
    needs: [version-check, publish-mcp-image]
    if: github.event_name == 'release' && vars.MCP_AWS_DEPLOY != ''
    runs-on: ubuntu-latest
    timeout-minutes: 80
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Deploy via CodePipeline
        uses: ./.github/actions/deploy-codepipeline
        with:
          role_arn: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ fromJson(vars.MCP_AWS_DEPLOY).role }}
          region: ${{ fromJson(vars.MCP_AWS_DEPLOY).region }}
          bucket: ${{ fromJson(vars.MCP_AWS_DEPLOY).pipeline }}-${{ secrets.AWS_ACCOUNT_ID }}
          pipeline: ${{ fromJson(vars.MCP_AWS_DEPLOY).pipeline }}
          container: mcp-server
          image: ghcr.io/flexprice/mcp-server:${{ needs.version-check.outputs.version }}
