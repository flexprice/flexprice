# Builds the hosted MCP server image from Dockerfile.mcp and pushes it to GHCR.
# It only publishes the image, it does not deploy.
name: Publish MCP Image to GHCR

on:
  workflow_call:
    inputs:
      version:
        description: 'MCP server version to build. Empty means the latest on npm.'
        required: false
        type: string
    secrets:
      GHCR_PUBLISH_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: 'MCP server version to build (e.g. 2.1.33). Leave empty for the latest on npm.'
        required: false
        type: string

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

env:
  REGISTRY: ghcr.io
  NPM_PACKAGE: '@flexprice/mcp-server'

jobs:
  build-and-publish:
    name: Build, test, scan, publish multi-arch MCP image
    runs-on: ubuntu-latest
    concurrency:
      group: publish-mcp-image
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve version and image tags
        id: tag
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          VERSION=""
          if [ -n "${INPUT_VERSION}" ]; then
            if ! echo "${INPUT_VERSION}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
              echo "::error::Invalid version format: ${INPUT_VERSION}"
              exit 1
            fi
            # Right after a release the version can take a moment to show up on
            # npm, so wait for it. A manual run checks once.
            TRIES=20
            if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
              TRIES=1
            fi
            for i in $(seq 1 "${TRIES}"); do
              VERSION="$(npm view "${NPM_PACKAGE}@${INPUT_VERSION}" version 2>/dev/null || true)"
              if [ -n "${VERSION}" ]; then
                break
              fi
              if [ "${i}" -lt "${TRIES}" ]; then
                sleep 15
              fi
            done
            if [ -z "${VERSION}" ]; then
              echo "::error::${NPM_PACKAGE}@${INPUT_VERSION} is not on npm"
              exit 1
            fi
          fi
          LATEST="$(npm view "${NPM_PACKAGE}" version)"
          VERSION="${VERSION:-${LATEST}}"
          # `latest` follows npm: an older version built by hand does not take it.
          PROMOTE="${VERSION}"
          if [ "${VERSION}" = "${LATEST}" ]; then
            PROMOTE="${VERSION} latest"
          fi
          # GHCR image names must be lowercase.
          IMG="${REGISTRY}/$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')/mcp-server"
          BUILD_TAG="${VERSION}-$(echo "${GITHUB_SHA}" | cut -c1-12)"
          ALL="${IMG}:${BUILD_TAG}"
          for t in ${PROMOTE}; do
            ALL="${ALL}"$'\n'"${IMG}:${t}"
          done
          {
            echo "version=${VERSION}"
            echo "image=${IMG}"
            echo "build_tag=${BUILD_TAG}"
            echo "promote_tags=${PROMOTE}"
            echo "all_tags<<EOF"
            echo "${ALL}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cache-binary: false

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          # PAT auth: the default GITHUB_TOKEN can't push to the org's GHCR
          # package unless the package is linked to this repo with Write.
          username: ${{ vars.GHCR_USERNAME || github.actor }}
          password: ${{ secrets.GHCR_PUBLISH_TOKEN }}

      # Only the build tag is pushed here. The version tags are added after the
      # Trivy scan passes.
      - name: Build & push multi-arch image (build tag only)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.mcp
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          build-args: |
            MCP_VERSION=${{ steps.tag.outputs.version }}
          tags: ${{ steps.tag.outputs.image }}:${{ steps.tag.outputs.build_tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.tag.outputs.version }}

      - name: Trivy vulnerability scan (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.tag.outputs.image }}:${{ steps.tag.outputs.build_tag }}
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      # Retags the scanned digest without rebuilding.
      - name: Promote scanned digest to version tags
        env:
          IMG: ${{ steps.tag.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          PROMOTE_TAGS: ${{ steps.tag.outputs.promote_tags }}
        run: |
          set -euo pipefail
          for t in ${PROMOTE_TAGS}; do
            echo "Promoting ${IMG}@${DIGEST} -> ${IMG}:${t}"
            docker buildx imagetools create -t "${IMG}:${t}" "${IMG}@${DIGEST}"
          done

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.tag.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image (keyless)
        env:
          IMG: ${{ steps.tag.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMG}@${DIGEST}"

      - name: Summary
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          TAGS: ${{ steps.tag.outputs.all_tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "## MCP Image Published"
            echo ""
            echo "- MCP server version: \`${VERSION}\`"
            echo "- Tags:"
            echo '```'
            echo "${TAGS}"
            echo '```'
            echo "- Platforms: linux/amd64, linux/arm64"
            echo "- Digest: \`${DIGEST}\`"
            echo "- SBOM + provenance: attached"
          } >> "$GITHUB_STEP_SUMMARY"
