name: Revert prod ECS (self ap-south-1)

# Standalone, deploy-only prod ECS revert. Redeploys a PRE-BUILT GHCR image
# (digest-pinned) to api, consumer and worker through the backend CodePipeline.
# NO build, NO migration.
#
# Triggered manually (workflow_dispatch) or cross-repo from infra revert.yml via a
# GitHub App token. deploy.yml (the forward pipeline) is intentionally untouched.

on:
  workflow_dispatch:
    inputs:
      image:
        description: 'Full GHCR pull ref: ghcr.io/flexprice/flexprice@sha256:<64hex>'
        required: true
      dry_run:
        description: 'Dry run — print the plan only, no upload/deploy'
        type: boolean
        default: true

concurrency:
  group: revert-ecs
  cancel-in-progress: false

# Least privilege at the top; only the deploy job gets id-token (OIDC to AWS).
permissions:
  contents: read

jobs:
  # Fail closed on a malformed pull ref before anything is deployed.
  validate:
    name: Validate image ref
    runs-on: self-hosted
    steps:
      - name: Validate image
        env:
          IMAGE: ${{ inputs.image }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$IMAGE" | grep -Eq '^ghcr\.io/flexprice/flexprice@sha256:[0-9a-f]{64}$'; then
            echo "::error::image must match ^ghcr.io/flexprice/flexprice@sha256:[0-9a-f]{64}\$"
            exit 1
          fi

  # Single manual approval gate before any prod ECS rollout. Dry runs bypass it
  # (nothing is uploaded/deployed anyway).
  approval-gate:
    name: Approve production revert
    needs: [validate]
    if: ${{ inputs.dry_run != true }}
    runs-on: self-hosted
    environment: prod-approval
    steps:
      - name: Production revert approved
        run: echo "Production ECS revert approved — deploying api, consumer, worker."

  revert-backend:
    name: Revert API, Consumer, Worker (CodePipeline)
    needs: [validate, approval-gate]
    if: >-
      ${{ always() &&
          needs.validate.result == 'success' &&
          (inputs.dry_run == true || needs.approval-gate.result == 'success') }}
    runs-on: self-hosted
    timeout-minutes: 80
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Deploy via CodePipeline
        uses: ./.github/actions/deploy-codepipeline
        with:
          role_arn: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ fromJson(vars.ECS_CODEPIPELINE).role }}
          region: ${{ fromJson(vars.ECS_CODEPIPELINE).region }}
          bucket: ${{ fromJson(vars.ECS_CODEPIPELINE).backend_pipeline }}-${{ secrets.AWS_ACCOUNT_ID }}
          pipeline: ${{ fromJson(vars.ECS_CODEPIPELINE).backend_pipeline }}
          container: main
          image: ${{ inputs.image }}
          dry_run: ${{ inputs.dry_run }}
