name: skip-coderabbit-develop-to-main

on:
  pull_request:
    types: [opened, reopened]
    branches: [main]

jobs:
  skip:
    if: github.head_ref == 'develop' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
    steps:
      - run: |
          if gh pr view "$PR" --json comments \
               --jq '.comments[].body' | grep -qF '@coderabbitai ignore'; then
            echo "ignore command already posted, skipping"
            exit 0
          fi
          gh pr comment "$PR" --body '@coderabbitai ignore'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
