# On release, regenerate the OpenAPI spec and open a PR in each downstream repo.
#
# - Regenerates rather than copying the committed spec: nothing guarantees that
#   file was refreshed before the release was cut.
# - Actions are SHA-pinned: this workflow carries a cross-repo write token.
name: Sync OpenAPI spec downstream

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to sync the spec from'
        required: false
        default: 'main'

permissions:
  contents: read

jobs:
  sync:
    if: ${{ github.event_name == 'workflow_dispatch' || (!github.event.release.prerelease && !github.event.release.draft) }}
    strategy:
      # One target failing must not block the other's PR.
      fail-fast: false
      matrix:
        include:
          - repo: flexprice/cli
            dest: spec/openapi.json
          - repo: flexprice/flexprice-docs
            dest: api-reference/openapi.json
    runs-on: ubuntu-latest
    steps:
      - name: Checkout monorepo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # make swagger shells out to Node and Python, so both are required here
      # even though this is a Go project.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Regenerate the OpenAPI spec
        run: make swagger

      # make swagger-3-0 posts to converter.swagger.io; when that service
      # misbehaves it writes a truncated file rather than failing outright.
      - name: Verify the regenerated spec is valid
        run: |
          SPEC=docs/swagger/swagger-3-0.json
          if [ ! -s "$SPEC" ]; then
            echo "::error::$SPEC is missing or empty after make swagger"
            exit 1
          fi
          python3 -c "import json,sys; d=json.load(open('$SPEC')); sys.exit(0 if d.get('openapi','').startswith('3.') and d.get('paths') else 1)" || {
            echo "::error::$SPEC is not a valid OpenAPI 3 document with paths"
            exit 1
          }
          echo "Spec OK: $(wc -c < "$SPEC") bytes"

      - name: Checkout target repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ matrix.repo }}
          token: ${{ secrets.SDK_DEPLOY_GIT_TOKEN }}
          path: target

      - name: Copy spec into target
        run: |
          mkdir -p "$(dirname "target/${{ matrix.dest }}")"
          cp docs/swagger/swagger-3-0.json "target/${{ matrix.dest }}"

      - name: Open sync PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          path: target
          token: ${{ secrets.SDK_DEPLOY_GIT_TOKEN }}
          branch: sync/openapi-spec
          commit-message: "chore: sync OpenAPI spec from flexprice ${{ github.event.release.tag_name || github.event.inputs.ref }}"
          title: "Sync OpenAPI spec from flexprice ${{ github.event.release.tag_name || github.event.inputs.ref }}"
          body: |
            Auto-generated by flexprice/flexprice's `sync-openapi-spec.yml`.

            Source: flexprice/flexprice @ ${{ github.event.release.html_url || github.event.inputs.ref }}

  notify-on-failure:
    needs: sync
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const title = 'OpenAPI spec sync failed';
            const body = `Workflow run failed: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nTriggered by: ${context.eventName}`;
            const { owner, repo } = context.repo;

            // Search by title, not label: the label may not exist here, and a
            // label-filtered query would then open a duplicate every failure.
            const existing = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', per_page: 100,
            });
            const match = existing.data.find(i => i.title === title);

            if (match) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: match.number, body,
              });
            } else {
              // A missing label must never swallow a failure report.
              try {
                await github.rest.issues.create({
                  owner, repo, title, body, labels: ['automation-failure'],
                });
              } catch (e) {
                core.warning(`Labelled issue creation failed (${e.message}); retrying without label.`);
                await github.rest.issues.create({ owner, repo, title, body });
              }
            }
