name: Run Tests

on:
  pull_request:
    branches: [ main, develop, 'feat/FLE-1513-billing-terms-*' ]
  push:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: billing_terms
          POSTGRES_PASSWORD: billing_terms_local
          POSTGRES_DB: billing_terms_test
        ports: [ '5432:5432' ]
        options: >-
          --health-cmd "pg_isready -U billing_terms -d billing_terms_test"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.2'
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Start isolated Temporal server
        run: |
          curl --fail --location --retry 3 -o /tmp/temporal.tar.gz \
            https://github.com/temporalio/cli/releases/download/v1.8.2/temporal_cli_1.8.2_linux_amd64.tar.gz
          echo 'd8421bda989e6514b4bdb4d63a9012a8a05a806892e881a5aad8510496349a94  /tmp/temporal.tar.gz' | sha256sum --check
          tar -xzf /tmp/temporal.tar.gz -C /tmp temporal
          /tmp/temporal server start-dev --disable-config-env --disable-config-file \
            --ip 127.0.0.1 --port 17333 --headless --namespace billing-terms-test \
            --log-level error > /tmp/billing-temporal.log 2>&1 &
          for attempt in $(seq 1 30); do
            if /tmp/temporal operator cluster health --address 127.0.0.1:17333; then exit 0; fi
            sleep 1
          done
          cat /tmp/billing-temporal.log
          exit 1

      - name: Run Tests
        env:
          FLEXPRICE_BILLING_TERMS_TEST_DSN: postgres://billing_terms:billing_terms_local@localhost:5432/billing_terms_test?sslmode=disable
          FLEXPRICE_TEST_POSTGRES_DSN: postgres://billing_terms:billing_terms_local@localhost:5432/billing_terms_test?sslmode=disable
          FLEXPRICE_BILLING_TERMS_TEST_TEMPORAL_ADDRESS: 127.0.0.1:17333
          FLEXPRICE_BILLING_TERMS_TEST_TEMPORAL_NAMESPACE: billing-terms-test
        run: |
          make test-coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  lint:
    name: Run Loglint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.2'
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Run loglint
        run: make lint-ci
