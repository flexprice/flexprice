name: Run Tests

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: flexprice_test
          POSTGRES_PASSWORD: flexprice_test
          POSTGRES_DB: flexprice_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flexprice_test -d flexprice_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FLEXPRICE_TEST_POSTGRES_DSN: postgres://flexprice_test:flexprice_test@localhost:5432/flexprice_test?sslmode=disable

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.2'
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Run Tests
        run: |
          make test-coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  lint:
    name: Run Loglint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.2'
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Run loglint
        run: make lint-ci
