name: Run Tests

on:
  pull_request:
    branches: [ main, develop, 'feat/FLE-1513-billing-terms-*' ]
  push:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: billing_terms
          POSTGRES_PASSWORD: billing_terms_local
          POSTGRES_DB: billing_terms_test
        ports: [ '5432:5432' ]
        options: >-
          --health-cmd "pg_isready -U billing_terms -d billing_terms_test"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.2'
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Run Tests
        env:
          FLEXPRICE_BILLING_TERMS_TEST_DSN: postgres://billing_terms:billing_terms_local@localhost:5432/billing_terms_test?sslmode=disable
          FLEXPRICE_TEST_POSTGRES_DSN: postgres://billing_terms:billing_terms_local@localhost:5432/billing_terms_test?sslmode=disable
        run: |
          make test-coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  lint:
    name: Run Loglint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.2'
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Run loglint
        run: make lint-ci
