# Example e2eprobe suite: the embedded default with every key spelled out, plus
# the two things a region adds by hand — a payer persona for its gateway and
# external_id lines adopting the previous generation's customers. Copy it, trim
# what a region does not run, and point E2EPROBE_SUITE_FILE at it (or set it as
# e2eprobe.suite in the Helm values). Validate with:
#   go run ./internal/ee/e2eprobe/cmd/e2eprobe validate --suite suite.yaml
#   go run ./internal/ee/e2eprobe/cmd/e2eprobe describe --suite suite.yaml
#
# Vocabulary
#   traits    subscription, tax, coupon, commitment, wallet, alerts, soft_limit,
#             additive_grant, bucketed, multi_cadence, payment (events is implied
#             by an events profile and must not be listed)
#   profiles  standard (27 events/tick across every unbucketed meter plus the
#             hour-bucketed ones), bucketed (6 events/tick on the 15MIN, HOUR
#             and DAY bucketed meters)
#   scenarios see `describe`; a scenario binds to every persona carrying its
#             traits unless `personas:` lists them; `families:` expands
#             <name>-<family>; `every` defaults per scenario; `enabled: false`
#             turns an entry off; `alert:` overrides defaults.alert per entry.

version: 1

defaults:
  tick: 10m                  # one bulk event batch per persona with a profile
  concurrency: 4             # scenarios running at once
  alert:
    after_failures: 3        # consecutive failures before an incident opens
    after_duration: 20m      # and failing for at least this long
    renotify_every: 6h       # reminders while an incident stays open
    skip_after: 24h          # a scenario skipping this long is a coverage incident
  load:
    max_events_per_day: 100000 # profile batches plus every flow's ingest; describe shows the split
  janitor:
    max_age: 1h              # ephemeral customers older than this are removed
  digest:
    every: 24h

tenant:
  connections: [stripe]      # preflight verifies these providers are connected
  settings:                  # JSON subsets preflight expects in tenant settings
    wallet_balance_alert_config: { alert_enabled: true }   # the canary's alerts need this on
  webhooks:
    silence_after: 6h        # no webhook of any kind for this long is one incident

personas:
  # external_id adopts a customer the previous probe generation created so the
  # cycle-invoice history it accumulated keeps feeding the invariants.
  - name: baseline-a
    external_id: e2eprobe-cust-persistent-3
    traits: [subscription]
    events: standard
  - name: baseline-b
    external_id: e2eprobe-cust-persistent-4
    traits: [subscription]
    events: standard
  # taxed also owns the legacy quarterly subscription, hence multi_cadence.
  - name: taxed
    external_id: e2eprobe-cust-persistent-0
    traits: [subscription, tax, multi_cadence]
    events: standard
  - name: couponed
    external_id: e2eprobe-cust-persistent-1
    traits: [subscription, coupon]
    events: standard
  - name: committed
    traits: [subscription, commitment]
    commitment: { amount: "5.00", overage_factor: "1.5" }
    events: standard
  # Wallet personas get no scheduled events: wallet-debit drives its own usage
  # so the expected balance delta is exact.
  - name: wallet-a
    external_id: e2eprobe-cust-persistent-2
    traits: [subscription, wallet]
    wallet: { balance: "100.00" }
  - name: alert-canary
    external_id: e2eprobe-cust-alert-canary
    traits: [subscription, wallet, alerts]
    wallet: { balance: "30.00", thresholds: { info: "25", warning: "10", critical: "0" } }
  - name: entitled
    traits: [subscription, soft_limit]
    events: standard
  - name: granted
    traits: [subscription, additive_grant]
    events: standard
  - name: bucketed
    traits: [subscription, bucketed]
    events: bucketed
  - name: payer-stripe
    traits: [payment]
    payment: { provider: stripe, currency: USD, fixed_customer: e2eprobe-cust-pay-stripe-cards, decline_last4: "0341" }

scenarios:
  - { name: provision, every: 6h }
  - { name: preflight, every: 6h }
  - { name: janitor, every: 1h }
  - { name: webhook-wiring, every: 15m }
  - { name: ingest }                                   # runs every tick
  - { name: usage, every: 15m }
  - { name: analytics-hourly, every: 1h, personas: [baseline-a] }   # hourly points of the unbucketed meters
  - { name: wallet-debit, every: 1h, personas: [wallet-a] }   # 500 events a run
  - { name: invoice-freshness, every: 1h, alert: { skip_after: 840h } }   # the first invoice lands after one cycle
  - { name: invoice, every: 1h, families: [tax, coupon, commitment], alert: { skip_after: 840h } }
  - { name: invoice-multi-cadence, every: 1h, alert: { skip_after: 2280h } }   # quarterly: first invoice after ~90 days
  - { name: entitlement-usage, every: 30m }
  - { name: low-balance-alert, every: 30m }   # one drive, an 8-minute wait for the webhook, one refill
  - { name: lifecycle, every: 30m, personas: [baseline-a] }
  - { name: cancel, every: 1h, personas: [baseline-a] }
  - { name: line-item-change, every: 1h, personas: [baseline-a] }
  - { name: tax-preview, every: 1h, personas: [taxed] }
  - { name: coupon-preview, every: 1h, personas: [couponed] }
  - { name: commitment-preview, every: 1h, personas: [committed] }
  - { name: entitlement-enforcement, every: 1h, personas: [entitled] }
  - { name: grant-inheritance, every: 1h, personas: [granted] }
  - { name: checkout-link, every: 30m }
  - { name: payment-methods, every: 1h }
  - { name: auto-charge, every: 6h }
  # Off by default: every tick creates plans, subscriptions and invoices.
  - { name: billing-matrix, every: 15m, enabled: false, families: [opening, change, grants, renewal, validation], per_run: 3 }
