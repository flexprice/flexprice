{{- if .Values.frontend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "flexprice.fullname" . }}-frontend
  labels:
    {{- include "flexprice.componentLabels" (dict "ctx" . "component" "frontend") | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      {{- include "flexprice.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        {{- include "flexprice.componentPodLabels" (dict "ctx" . "component" "frontend") | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if eq .Values.frontend.mode "gcsproxy" }}
      serviceAccountName: {{ .Values.frontend.serviceAccount.name | default (printf "%s-ui" (include "flexprice.fullname" .)) }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        {{- if eq .Values.frontend.mode "gcsproxy" }}
        {{- /*
          Static SPA served straight from GCS. gcsproxy holds the bucket
          credential (Workload Identity via the pod's ServiceAccount) and
          listens on loopback only; nginx is the sole listener on the Service
          port and adds gzip, asset caching and SPA fallback.

          Deploying a new UI build is a bucket sync — no pod restart. Hashed
          /assets/* are immutable so nginx caches them hard, while the app shell
          is never cached, which is why a sync is visible immediately.
        */}}
        - name: gcsproxy
          {{- if not .Values.frontend.gcs.bucket }}
          {{- fail "frontend.mode=gcsproxy requires frontend.gcs.bucket" }}
          {{- end }}
          {{- /*
            Clears RUN_AS_NONROOT + PRIVILEGE_ESCALATION. readOnlyRootFilesystem
            is left off for gcsproxy (unlike nginx) — it's a third-party binary
            with no dedicated scratch volume, and RO rootfs is not what the SCC
            findings require.
          */}}
          securityContext:
            {{- toYaml (omit .Values.securityContext "readOnlyRootFilesystem") | nindent 12 }}
            readOnlyRootFilesystem: false
          image: {{ .Values.frontend.gcs.image | quote }}
          args:
            - "-bucket"
            - {{ .Values.frontend.gcs.bucket | quote }}
            - "-b"
            - "127.0.0.1:{{ .Values.frontend.gcs.port }}"
            - "-i"
            - {{ .Values.frontend.gcs.indexObject | quote }}
            - "-spa"
            - "-log-format"
            - "json"
          ports:
            - name: gcsproxy
              containerPort: {{ .Values.frontend.gcs.port }}
              protocol: TCP
          resources:
            {{- toYaml .Values.frontend.gcs.resources | nindent 12 }}
        - name: nginx
          {{- /*
            nginx (RO rootfs from .Values.securityContext) writes only to the
            emptyDir mounts below (/var/cache/nginx, /var/run); listens on 3000,
            an unprivileged port, so dropping ALL caps + no-new-privs is safe.
          */}}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: {{ .Values.frontend.nginx.image | quote }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
            {{- /*
              nginx runs as non-root under the chart's podSecurityContext
              (runAsNonRoot, runAsUser 1000), so every path it writes to must be
              a writable volume. proxy_cache_path makes it create a cache
              directory at startup, which otherwise fails hard:
                [emerg] mkdir() "/var/cache/nginx/gcs" failed (13: Permission denied)
              and the container CrashLoopBackOffs while gcsproxy beside it stays
              healthy. The raw region manifests this mode replaces ran without
              any securityContext, so they never hit it.
            */}}
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            {{- toYaml .Values.frontend.nginx.resources | nindent 12 }}
        {{- else }}
        - name: frontend
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: VITE_API_URL
              value: {{ .Values.frontend.env.apiUrl | quote }}
            - name: VITE_ENVIRONMENT
              value: {{ .Values.frontend.env.environment | quote }}
            {{- if .Values.frontend.env.supabaseUrl }}
            - name: VITE_SUPABASE_URL
              value: {{ .Values.frontend.env.supabaseUrl | quote }}
            {{- end }}
            {{- if .Values.frontend.env.supabaseAnonKey }}
            - name: VITE_SUPABASE_ANON_KEY
              value: {{ .Values.frontend.env.supabaseAnonKey | quote }}
            {{- end }}
            {{- with .Values.frontend.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
        {{- end }}
      {{- if eq .Values.frontend.mode "gcsproxy" }}
      volumes:
        - name: nginx-conf
          configMap:
            name: {{ include "flexprice.fullname" . }}-ui-nginx
            items:
              - key: default.conf
                path: default.conf
        # Writable scratch for a non-root nginx: the proxy cache and the pid
        # file. Both are ephemeral by nature — the cache is a performance aid
        # over immutable hashed assets, never a source of truth.
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
      {{- end }}
      {{- with (default .Values.nodeSelector .Values.frontend.nodeSelector) }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (default .Values.affinity .Values.frontend.affinity) }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (default .Values.tolerations .Values.frontend.tolerations) }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (include "flexprice.topologySpreadConstraints" (dict "ctx" . "component" "frontend") | trim) }}
      topologySpreadConstraints:
        {{- . | nindent 8 }}
      {{- end }}
{{- end }}
---
{{- if .Values.frontend.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "flexprice.fullname" . }}-frontend
  labels:
    {{- include "flexprice.componentLabels" (dict "ctx" . "component" "frontend") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "flexprice.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
{{- end }}
