{{- if .Values.api.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "flexprice.fullname" . }}-api
  labels:
    {{- include "flexprice.componentLabels" (dict "ctx" . "component" "api") | nindent 4 }}
  {{- $parallel := include "flexprice.gceParallelEnabled" . }}
  {{- $sharedGce := and $parallel (not .Values.gceIngress.ownService) }}
  {{- if $sharedGce }}
  annotations:
    # GCE needs a NEG to route to pod IPs.
    cloud.google.com/neg: '{"ingress": true}'
    beta.cloud.google.com/backend-config: '{"default": "{{ include "flexprice.gceIngressName" . }}"}'
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "flexprice.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
{{- end }}

