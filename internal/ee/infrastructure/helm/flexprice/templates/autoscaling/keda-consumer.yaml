{{- if and .Values.consumer.enabled .Values.consumer.keda.enabled -}}
{{- if .Values.consumer.autoscaling.enabled }}
{{- fail "consumer: enable either consumer.autoscaling (HPA) or consumer.keda (KEDA), not both — they fight over the same Deployment" }}
{{- end }}
{{- /*
  KEDA ScaledObject for the consumer Deployment. Scales on Kafka consumer-group
  lag rather than CPU — the right signal for a Kafka consumer where each
  message's processing cost is small but throughput matters.

  Requires KEDA (https://keda.sh) installed cluster-wide. Off by default.

  When this resource is rendered, KEDA takes over autoscaling for the
  consumer Deployment — disable the chart-rendered HPA via
  `consumer.autoscaling.enabled=false` to avoid two controllers fighting.
*/}}
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ include "flexprice.fullname" . }}-consumer
  labels:
    {{- include "flexprice.componentLabels" (dict "ctx" . "component" "consumer") | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "flexprice.fullname" . }}-consumer
  pollingInterval: {{ .Values.consumer.keda.pollingInterval | default 15 }}
  cooldownPeriod: {{ .Values.consumer.keda.cooldownPeriod | default 300 }}
  minReplicaCount: {{ .Values.consumer.keda.minReplicas | default 1 }}
  maxReplicaCount: {{ .Values.consumer.keda.maxReplicas | default 10 }}
  {{- with .Values.consumer.keda.fallback }}
  fallback:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  triggers:
    {{- $topics := .Values.consumer.keda.topics }}
    {{- if not $topics }}
    {{- $topics = list (dict "topic" .Values.kafkaConfig.topic "lagThreshold" .Values.consumer.keda.lagThreshold) }}
    {{- end }}
    {{- range $t := $topics }}
    - type: kafka
      metadata:
        bootstrapServers: {{ include "flexprice.kafkaBrokers" $ | quote }}
        consumerGroup: {{ $.Values.kafkaConfig.consumerGroup | quote }}
        topic: {{ $t.topic | quote }}
        lagThreshold: {{ $t.lagThreshold | default $.Values.consumer.keda.lagThreshold | default 1000 | quote }}
        offsetResetPolicy: {{ $.Values.consumer.keda.offsetResetPolicy | default "earliest" | quote }}
        {{- if or $.Values.kafkaConfig.tls $.Values.kafkaConfig.useSASL }}
        tls: enable
        {{- end }}
        {{- if $.Values.kafkaConfig.useSASL }}
        {{- /*
          KEDA's Kafka scaler names mechanisms differently from sarama: it wants
          lowercase, underscore-separated values (scram_sha512), not the
          SCRAM-SHA-512 spelling kafkaConfig.saslMechanism carries. Passing the
          sarama spelling through makes the scaler fail to authenticate, so map
          it here rather than asking operators to set the value twice.

          An unmapped mechanism fails the render instead of defaulting to
          plaintext: a silent default produces a scaler that cannot authenticate
          and reports a misleading error, which is the exact bug this mapping
          exists to prevent.
        */}}
        {{- $saslMap := dict "SCRAM-SHA-512" "scram_sha512" "SCRAM-SHA-256" "scram_sha256" "PLAIN" "plaintext" "OAUTHBEARER" "oauthbearer" }}
        {{- $mechanism := $.Values.kafkaConfig.saslMechanism | default "PLAIN" }}
        {{- if not (hasKey $saslMap $mechanism) }}
        {{- fail (printf "kafkaConfig.saslMechanism %q has no KEDA equivalent; the KEDA Kafka scaler supports only: %s. Set the sarama spelling (e.g. SCRAM-SHA-512), or disable consumer.keda.enabled." $mechanism (join ", " (keys $saslMap | sortAlpha))) }}
        {{- end }}
        sasl: {{ get $saslMap $mechanism | quote }}
        {{- end }}
      {{- /*
        KEDA's operator dials Kafka itself, so it never sees the CA mounted from
        kafkaConfig.tlsCASecret into the workload pods. Credentials and a private
        broker CA both have to reach it through an operator-supplied
        TriggerAuthentication — and through the SAME one, since a trigger takes a
        single authenticationRef. See consumer.keda.authenticationRef in
        values.yaml for the resource shape, including the `ca` parameter.
      */}}
      {{- with $.Values.consumer.keda.authenticationRef }}
      authenticationRef:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- end }}
    {{- if .Values.consumer.keda.cpuValue }}
    - type: cpu
      metricType: Utilization
      metadata:
        value: {{ .Values.consumer.keda.cpuValue | quote }}
    {{- end }}
    {{- if .Values.consumer.keda.memValue }}
    - type: memory
      metricType: Utilization
      metadata:
        value: {{ .Values.consumer.keda.memValue | quote }}
    {{- end }}
{{- end }}
