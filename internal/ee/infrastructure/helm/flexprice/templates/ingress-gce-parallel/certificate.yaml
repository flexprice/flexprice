{{- if and (include "flexprice.gceParallelEnabled" .) .Values.api.enabled }}
{{- if eq .Values.gceIngress.tls.mode "certManager" }}
{{- if .Values.gceIngress.tls.clusterIssuer }}
# Own Certificate; DNS-01 issues before the LB serves.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "flexprice.gceIngressCertName" . }}
  labels:
    {{- include "flexprice.componentLabels" (dict "ctx" . "component" "api") | nindent 4 }}
spec:
  secretName: {{ include "flexprice.gceIngressSecretName" . }}
  dnsNames:
    {{- range include "flexprice.gceIngressHosts" . | fromYamlArray }}
    - {{ . | quote }}
    {{- end }}
  issuerRef:
    name: {{ $.Values.gceIngress.tls.clusterIssuer | quote }}
    kind: {{ $.Values.gceIngress.tls.issuerKind }}
{{- end }}
{{- end }}
{{- if eq .Values.gceIngress.tls.mode "managed" }}
# Google-managed certificate. Validation is over HTTP against the load balancer,
# so the DNS record must ALREADY point at this Ingress's static IP before the
# certificate can go Active, and provisioning takes 15-60 minutes. That inverts
# the safe cutover order; prefer tls.mode=certManager with a DNS-01 issuer.
apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: {{ include "flexprice.gceIngressCertName" . }}
  labels:
    {{- include "flexprice.componentLabels" (dict "ctx" . "component" "api") | nindent 4 }}
spec:
  domains:
    {{- range include "flexprice.gceIngressHosts" . | fromYamlArray }}
    - {{ . | quote }}
    {{- end }}
{{- end }}
{{- end }}
