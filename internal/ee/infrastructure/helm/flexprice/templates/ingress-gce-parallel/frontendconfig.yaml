{{- if and (include "flexprice.gceParallelEnabled" .) .Values.api.enabled }}
# Always rendered; dangling annotation blocks provisioning.
apiVersion: networking.gke.io/v1beta1
kind: FrontendConfig
metadata:
  name: {{ include "flexprice.gceIngressName" . }}
  labels:
    {{- include "flexprice.componentLabels" (dict "ctx" . "component" "api") | nindent 4 }}
spec:
  {{- with .Values.gceIngress.frontendConfig.sslPolicy }}
  # Name of a pre-existing compute SSL policy. Created out of band (Terraform),
  # because the chart cannot create GCP resources.
  sslPolicy: {{ . | quote }}
  {{- end }}
  redirectToHttps:
    enabled: {{ .Values.gceIngress.frontendConfig.redirectToHttps.enabled }}
    {{- if .Values.gceIngress.frontendConfig.redirectToHttps.enabled }}
    responseCodeName: {{ .Values.gceIngress.frontendConfig.redirectToHttps.responseCodeName }}
    {{- end }}
{{- end }}
