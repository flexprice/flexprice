{{- if and .Values.gceIngress.enabled .Values.api.enabled }}
# Parallel GCE Ingress -- a SECOND Ingress alongside the chart's `ingress.*` one.
#
# Purpose: migrate an API off ingress-nginx onto a GCE global external
# Application Load Balancer with zero downtime. Both Ingresses serve the same
# pods through their own load balancers; DNS decides which takes traffic, and
# reverting the DNS record is the rollback.
#
# `ingress.provider: gce` cannot do this -- it converts the single chart Ingress,
# deleting the nginx load balancer before the replacement serves. Measured on
# GCP staging: a fresh GCE load balancer needed ~12 minutes from apply to first
# 200, and an ADDRESS plus HEALTHY backends appeared ~6 minutes BEFORE it served.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "flexprice.gceIngressName" . }}
  labels:
    {{- include "flexprice.componentLabels" (dict "ctx" . "component" "api") | nindent 4 }}
  annotations:
    # The legacy class ANNOTATION, not spec.ingressClassName. GKE enables the
    # httpLoadBalancing addon without necessarily creating a `gce` IngressClass
    # object; with ingressClassName: gce and no such object, no controller claims
    # the Ingress -- no events, no ADDRESS, nothing in the console. It looks like
    # a stuck provision when provisioning was never attempted. kubectl warns the
    # annotation is deprecated; that warning is expected here.
    kubernetes.io/ingress.class: "gce"
    {{- with .Values.gceIngress.globalStaticIpName }}
    # Reserved global address, so the IP survives Ingress recreation and the DNS
    # record stays valid. Without it the load balancer takes an ephemeral IP.
    kubernetes.io/ingress.global-static-ip-name: {{ . | quote }}
    {{- end }}
    kubernetes.io/ingress.allow-http: {{ .Values.gceIngress.allowHttp | quote }}
    networking.gke.io/v1beta1.FrontendConfig: {{ include "flexprice.gceIngressName" . }}
    {{- if eq .Values.gceIngress.tls.mode "managed" }}
    networking.gke.io/managed-certificates: {{ include "flexprice.gceIngressCertName" . }}
    {{- end }}
    {{- with .Values.gceIngress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- if eq .Values.gceIngress.tls.mode "certManager" }}
  tls:
    - hosts:
        {{- range include "flexprice.gceIngressHosts" . | fromYamlArray }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ include "flexprice.gceIngressSecretName" . }}
  {{- end }}
  rules:
    {{- range include "flexprice.gceIngressHosts" . | fromYamlArray }}
    - host: {{ . | quote }}
      http:
        paths:
          # ImplementationSpecific + /* is the GCE-native form. pathType Prefix
          # with path / also works, but /* matches what the GCE controller emits
          # and keeps the rendered url-map identical to a hand-written one.
          - path: /*
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ include "flexprice.gceIngressName" $ }}
                port:
                  number: {{ $.Values.service.port }}
    {{- end }}
{{- end }}
