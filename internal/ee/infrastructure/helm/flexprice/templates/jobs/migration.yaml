{{- if .Values.migration.enabled }}
---
apiVersion: batch/v1
kind: Job
metadata:
  {{- /*
    Name suffix hashes the RENDERED ENVIRONMENT, not templates/app/configmap.yaml.

    That template renders nothing under the config-autobind shape (.Values.env
    set) — and, as it turns out, nothing for the legacy shape either, since the
    app config moved out of a ConfigMap. Hashing it therefore produced a
    CONSTANT suffix for every release in every region.

    A constant name is fatal under ArgoCD: it records the hook as completed for
    the revision and never recreates it, so the migration silently never runs
    while the app Deployments roll out normally. The pods come up Running
    against an unmigrated database, and /health does not touch Postgres so
    nothing surfaces the problem. Any Job created by hand with the same name is
    pruned as a duplicate of that already-completed hook.

    flexprice.env is the actual config surface (74 vars in a production region),
    so hashing it gives a suffix that is stable when config is unchanged and
    changes whenever it is — which is what the checksum was always meant to do.
  */}}
  name: {{ include "flexprice.fullname" . }}-migration-{{ include "flexprice.env" . | sha256sum | trunc 8 }}
  labels:
    {{- include "flexprice.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
  annotations:
    checksum/config: {{ include "flexprice/templates/app/configmap.yaml" . | sha256sum }}
    checksum/secret: {{ include "flexprice/templates/app/secret.yaml" . | sha256sum }}
    "helm.sh/hook": pre-upgrade,pre-install
    "helm.sh/hook-weight": "-5"
    {{- /*
      hook-succeeded ONLY — deliberately NOT before-hook-creation.

      ArgoCD implements before-hook-creation by deleting the existing hook
      resource and then immediately reconciling against it, which races itself:
      the Job is removed and the very next read fails with
        Resource batch/Job/<name> is missing, it might have been deleted
      so the PreSync phase never advances past the ServiceAccount and the
      migration never runs. The sync reports failure while the app Deployments
      still roll out, leaving pods running against an unmigrated database.

      Nothing is lost by dropping it: the Job name already embeds a checksum of
      the rendered ConfigMap (see metadata.name above), so a changed config
      produces a differently-named Job and there is no same-named predecessor
      to clear. hook-succeeded still removes the Job once it completes.
    */}}
    {{- /*
      hook-failed is paired with hook-succeeded so the Job is removed whichever
      way it ends. Without it a FAILED Job lingers under a name derived from the
      config checksum, and retrying with unchanged config collides with it:
      ArgoCD reports the hook as already-completed and never re-runs it, or the
      apply fails on an immutable Job spec. That is precisely what stalled the
      northamerica-northeast2 bring-up — the migration had failed once, and
      every later sync silently declined to try again.

      ttlSecondsAfterFinished still bounds the window, but only after an hour;
      this makes the retry immediate. Logs are lost on failure, which is the
      accepted trade — the Job is re-runnable and the pod logs are the place to
      look while it is still running.
    */}}
    "helm.sh/hook-delete-policy": hook-succeeded,hook-failed
spec:
  backoffLimit: {{ .Values.migration.backoffLimit | default 3 }}
  {{- if .Values.migration.activeDeadlineSeconds }}
  activeDeadlineSeconds: {{ .Values.migration.activeDeadlineSeconds }}
  {{- end }}
  ttlSecondsAfterFinished: {{ .Values.migration.ttlSecondsAfterFinished | default 3600 }}
  template:
    metadata:
      labels:
        {{- include "flexprice.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migration
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # Dedicated pre-install hook SA (jobs/migration-prereqs.yaml) so this hook,
      # which runs before the primary SA is created, has an account to run as.
      serviceAccountName: {{ include "flexprice.fullname" . }}-migration
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      restartPolicy: Never
      initContainers:

        # ── 1. Wait for PostgreSQL ────────────────────────────────────────────
        - name: wait-for-postgres
          image: "{{ include "flexprice.migrationImage" (dict "ctx" . "name" "postgres") }}"
          command:
            - sh
            - -c
            - |
              set -e
              POSTGRES_HOST="{{ include "flexprice.postgresHost" . }}"
              POSTGRES_PORT="{{ include "flexprice.postgresPort" . }}"
              POSTGRES_USER="{{ .Values.postgres.user }}"
              echo "Waiting for PostgreSQL at ${POSTGRES_HOST}:${POSTGRES_PORT}..."
              RETRIES=60
              i=1
              while [ $i -le ${RETRIES} ]; do
                if pg_isready -h "${POSTGRES_HOST}" -p "${POSTGRES_PORT}" -U "${POSTGRES_USER}" >/dev/null 2>&1; then
                  echo "✅ PostgreSQL is ready!"
                  exit 0
                fi
                echo "[$i/${RETRIES}] Not ready yet..."
                sleep 2
                i=$((i + 1))
              done
              echo "❌ PostgreSQL failed to become ready"
              exit 1
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "flexprice.secretName" . }}
                  key: postgres-password
          resources:
            limits:
              cpu: "100m"
              memory: "64Mi"
            requests:
              cpu: "50m"
              memory: "32Mi"


        {{- if .Values.migration.steps.clickhouse }}
        # ── 2. Wait for ClickHouse ────────────────────────────────────────────
        - name: wait-for-clickhouse
          image: "{{ include "flexprice.migrationImage" (dict "ctx" . "name" "busybox") }}"
          command:
            - sh
            - -c
            - |
              CLICKHOUSE_HOST="{{ if eq .Values.clickhouse.mode "external" }}{{ index (splitList ":" .Values.clickhouse.address) 0 }}{{ else if eq .Values.clickhouse.mode "altinity" }}chi-{{ include "flexprice.fullname" . }}-flexprice-0-0{{ if .Values.clickhouse.namespace }}.{{ .Values.clickhouse.namespace }}.svc.cluster.local{{ end }}{{ else }}{{ include "flexprice.clickhouseServiceHost" . }}{{ end }}"
              CLICKHOUSE_HTTP_PORT="{{ if eq .Values.clickhouse.mode "external" }}{{ index (splitList ":" .Values.clickhouse.address) 1 }}{{ else if eq .Values.clickhouse.mode "altinity" }}8123{{ else }}{{ .Values.clickhouse.standalone.service.httpPort }}{{ end }}"
              echo "Waiting for ClickHouse at ${CLICKHOUSE_HOST}:${CLICKHOUSE_HTTP_PORT}..."
              until nc -z "${CLICKHOUSE_HOST}" "${CLICKHOUSE_HTTP_PORT}"; do
                echo "Not ready yet..."
                sleep 2
              done
              echo "✅ ClickHouse is ready!"
          resources:
            limits:
              cpu: "100m"
              memory: "64Mi"
            requests:
              cpu: "50m"
              memory: "32Mi"
        {{- end }}

        # ── 3. Wait for Kafka ─────────────────────────────────────────────────
        {{- if .Values.migration.steps.kafka }}
        - name: wait-for-kafka
          image: "{{ include "flexprice.migrationImage" (dict "ctx" . "name" "busybox") }}"
          command:
            - sh
            - -c
            - |
              {{- /* brokers may be a comma-separated string (prod overrides) or a YAML list (default).
                     Normalize to a list, take element 0, split host:port. */}}
              {{- $brokersRaw := .Values.kafkaConfig.brokers }}
              {{- $brokersList := list }}
              {{- if kindIs "string" $brokersRaw }}
                {{- $brokersList = splitList "," $brokersRaw }}
              {{- else }}
                {{- $brokersList = $brokersRaw }}
              {{- end }}
              {{- $firstBroker := trim (index $brokersList 0) }}
              {{- $brokerParts := splitList ":" $firstBroker }}
              KAFKA_HOST="{{ if .Values.kafkaConfig.external.enabled }}{{ index $brokerParts 0 }}{{ else }}{{ printf "%s-kafka" .Release.Name }}{{ end }}"
              KAFKA_PORT="{{ if .Values.kafkaConfig.external.enabled }}{{ index $brokerParts 1 }}{{ else }}9092{{ end }}"
              echo "Waiting for Kafka at ${KAFKA_HOST}:${KAFKA_PORT}..."
              RETRIES=60
              i=1
              while [ $i -le ${RETRIES} ]; do
                if nc -z "${KAFKA_HOST}" "${KAFKA_PORT}" >/dev/null 2>&1; then
                  echo "✅ Kafka is ready!"
                  exit 0
                fi
                echo "[$i/${RETRIES}] Not ready yet..."
                sleep 3
                i=$((i + 1))
              done
              echo "❌ Kafka failed to become ready"
              exit 1
          resources:
            limits:
              cpu: "100m"
              memory: "64Mi"
            requests:
              cpu: "50m"
              memory: "32Mi"
        {{- end }}

        {{- if .Values.migration.steps.postgresSetup }}
        # ── 4. PostgreSQL schema + extensions setup ───────────────────────────
        - name: setup-postgres-schema
          image: "{{ include "flexprice.migrationImage" (dict "ctx" . "name" "postgres") }}"
          command:
            - sh
            - -c
            - |
              set -e
              POSTGRES_HOST="{{ include "flexprice.postgresHost" . }}"
              POSTGRES_PORT="{{ include "flexprice.postgresPort" . }}"
              POSTGRES_USER="{{ .Values.postgres.user }}"
              POSTGRES_DB="{{ .Values.postgres.dbname }}"
              # Create the target database if it does not exist.
              #
              # CloudSQL regions get this from Terraform, but the AlloyDB module
              # cannot: there is no google_alloydb_database resource in the
              # provider and no gcloud equivalent, so its README says to create
              # databases over SQL after apply. Nothing automated that, and every
              # step below connects with -d ${POSTGRES_DB}, so a fresh AlloyDB
              # region failed here with
              #   FATAL: database "flexprice" does not exist
              # after the operator had already assumed the region was built.
              #
              # Postgres has no CREATE DATABASE IF NOT EXISTS, so this checks
              # pg_database first and connects to the always-present `postgres`
              # database to issue the CREATE. Idempotent: a no-op everywhere the
              # database already exists, including every current region.
              if ! psql -h ${POSTGRES_HOST} -p ${POSTGRES_PORT} -U ${POSTGRES_USER} -d postgres \
                   -tAc "SELECT 1 FROM pg_database WHERE datname='${POSTGRES_DB}'" | grep -q 1; then
                echo "Database ${POSTGRES_DB} not found, creating..."
                psql -h ${POSTGRES_HOST} -p ${POSTGRES_PORT} -U ${POSTGRES_USER} -d postgres \
                  -c "CREATE DATABASE \"${POSTGRES_DB}\"" || exit 1
                echo "✅ Created database ${POSTGRES_DB}"
              else
                echo "Database ${POSTGRES_DB} already exists"
              fi
              echo "Setting up PostgreSQL schema and extensions at ${POSTGRES_HOST}:${POSTGRES_PORT}..."
              psql -h ${POSTGRES_HOST} -p ${POSTGRES_PORT} -U ${POSTGRES_USER} -d ${POSTGRES_DB} \
                -c "CREATE SCHEMA IF NOT EXISTS extensions;" || exit 1
              psql -h ${POSTGRES_HOST} -p ${POSTGRES_PORT} -U ${POSTGRES_USER} -d ${POSTGRES_DB} \
                -c "CREATE EXTENSION IF NOT EXISTS \"uuid-ossp\" SCHEMA extensions;" || exit 1
              echo "✅ PostgreSQL schema and extensions ready"
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "flexprice.secretName" . }}
                  key: postgres-password
          resources:
            limits:
              cpu: "100m"
              memory: "64Mi"
            requests:
              cpu: "50m"
              memory: "32Mi"
        {{- end }}

        {{- if .Values.migration.steps.clickhouse }}
        # ── 5. Copy ClickHouse migrations from app image ──────────────────────
        # ── 5. Run ClickHouse migrations ──────────────────────────────────────
        # Uses the migrate binary from the flexprice image, the same way the Ent
        # step below does, rather than copying *.sql out of the image and
        # replaying them through clickhouse-client.
        #
        # The Go path is what the application actually tests: it globs the same
        # migrations/clickhouse/*.sql, but it also CREATEs the database if it is
        # missing (connecting to `default` first, then reconnecting scoped), and
        # it handles statement splitting and errors in code rather than a shell
        # loop. The shell path had no database creation at all, so a freshly
        # provisioned ClickHouse failed on the first statement with
        #   Code: 81. DB::Exception: Database flexprice does not exist.
        #
        # --clickhouse-dir defaults to migrations/clickhouse, relative to the
        # image WORKDIR /app, so no flag is needed.
        - name: run-clickhouse-migrations
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              set -e
              echo "Running ClickHouse migrations..."
              MIGRATE_BINARY=""
              if [ -f /app/migrate ] && [ -x /app/migrate ]; then
                MIGRATE_BINARY="/app/migrate"
              elif [ -f /app/bin/migrate ] && [ -x /app/bin/migrate ]; then
                MIGRATE_BINARY="/app/bin/migrate"
              else
                echo "❌ Migration binary not found at /app/migrate or /app/bin/migrate"
                exit 1
              fi
              echo "Using: ${MIGRATE_BINARY}"
              ${MIGRATE_BINARY} clickhouse || exit 1
              echo "✅ ClickHouse migrations complete"
          env:
            {{- include "flexprice.env" . | nindent 12 }}
          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
            requests:
              cpu: "100m"
              memory: "128Mi"
        {{- end }}

        {{- if .Values.migration.steps.ent }}
        # ── 7. Run Ent framework migrations ──────────────────────────────────
        - name: run-ent-migrations
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              set -e
              echo "Running Ent framework migrations..."
              MIGRATE_BINARY=""
              if [ -f /app/migrate ] && [ -x /app/migrate ]; then
                MIGRATE_BINARY="/app/migrate"
              elif [ -f /app/bin/migrate ] && [ -x /app/bin/migrate ]; then
                MIGRATE_BINARY="/app/bin/migrate"
              else
                echo "❌ Migration binary not found at /app/migrate or /app/bin/migrate"
                exit 1
              fi
              echo "Using: ${MIGRATE_BINARY}"
              ${MIGRATE_BINARY} postgres --timeout {{ .Values.migration.timeout | default 300 }} || exit 1
              echo "✅ Ent migrations complete"
          env:
            {{- include "flexprice.env" . | nindent 12 }}
          {{- if or (not .Values.env) .Values.kafkaConfig.tlsCASecret.name }}
          volumeMounts:
            {{- if not .Values.env }}
            - name: config
              mountPath: /app/config/config.yaml
              subPath: config.yaml
              readOnly: true
            {{- end }}
            {{- /* This step receives FLEXPRICE_KAFKA_TLS_CA_CERT_FILE via
                   "flexprice.env"; mount the CA so the path it names always
                   resolves, rather than dangling. */}}
            {{- include "flexprice.kafkaTLSVolumeMounts" . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.migration.resources | nindent 12 }}
        {{- end }}

        {{- if .Values.migration.steps.seed }}
        # ── 8. Seed PostgreSQL with default tenant, user, environments ────────
        - name: seed-postgres
          image: "{{ include "flexprice.migrationImage" (dict "ctx" . "name" "postgres") }}"
          command:
            - sh
            - -c
            - |
              set -e
              POSTGRES_HOST="{{ include "flexprice.postgresHost" . }}"
              POSTGRES_PORT="{{ include "flexprice.postgresPort" . }}"
              POSTGRES_USER="{{ .Values.postgres.user }}"
              POSTGRES_DB="{{ .Values.postgres.dbname }}"
              echo "Seeding default data into ${POSTGRES_DB}..."
              psql -h ${POSTGRES_HOST} -p ${POSTGRES_PORT} -U ${POSTGRES_USER} -d ${POSTGRES_DB} <<'EOSQL'
              INSERT INTO public.tenants (id, name, created_at, updated_at)
              VALUES ('00000000-0000-0000-0000-000000000000', 'Default Tenant', CURRENT_TIMESTAMP, CURRENT_TIMESTAMP)
              ON CONFLICT (id) DO NOTHING;

              INSERT INTO public.users (id, email, tenant_id, created_at, updated_at, created_by, updated_by)
              VALUES ('00000000-0000-0000-0000-000000000000', 'admin@flexprice.dev', '00000000-0000-0000-0000-000000000000', CURRENT_TIMESTAMP, CURRENT_TIMESTAMP, '00000000-0000-0000-0000-000000000000', '00000000-0000-0000-0000-000000000000')
              ON CONFLICT (id) DO NOTHING;

              INSERT INTO public.environments (id, name, type, tenant_id, status, created_by, updated_by, created_at, updated_at)
              VALUES ('00000000-0000-0000-0000-000000000000', 'Sandbox', 'development', '00000000-0000-0000-0000-000000000000', 'published', '00000000-0000-0000-0000-000000000000', '00000000-0000-0000-0000-000000000000', CURRENT_TIMESTAMP, CURRENT_TIMESTAMP)
              ON CONFLICT (id) DO NOTHING;

              INSERT INTO public.environments (id, name, type, tenant_id, status, created_by, updated_by, created_at, updated_at)
              VALUES ('00000000-0000-0000-0000-000000000001', 'Production', 'production', '00000000-0000-0000-0000-000000000000', 'published', '00000000-0000-0000-0000-000000000000', '00000000-0000-0000-0000-000000000000', CURRENT_TIMESTAMP, CURRENT_TIMESTAMP)
              ON CONFLICT (id) DO NOTHING;

              INSERT INTO public.auths (user_id, provider, token, status, created_at, updated_at)
              VALUES ('00000000-0000-0000-0000-000000000000', 'flexprice', 'sk_local_flexprice_test_key', 'published', CURRENT_TIMESTAMP, CURRENT_TIMESTAMP)
              ON CONFLICT DO NOTHING;

              INSERT INTO public.secrets (id, tenant_id, environment_id, name, type, provider, value, display_id, status, created_by, updated_by, created_at, updated_at)
              VALUES ('sk_local_flexprice_test_key', '00000000-0000-0000-0000-000000000000', '00000000-0000-0000-0000-000000000000', 'Local Test Key', 'private_key', 'flexprice', '0cfd568f22158887f8b77bc019fb245b1f14077b80936342b052985efa7de46c', 'sk_local_****_test_key', 'published', '00000000-0000-0000-0000-000000000000', '00000000-0000-0000-0000-000000000000', CURRENT_TIMESTAMP, CURRENT_TIMESTAMP)
              ON CONFLICT (id) DO NOTHING;
              EOSQL
              echo "✅ Seed data inserted"
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "flexprice.secretName" . }}
                  key: postgres-password
          resources:
            limits:
              cpu: "100m"
              memory: "64Mi"
            requests:
              cpu: "50m"
              memory: "32Mi"
        {{- end }}

        {{- if .Values.migration.steps.kafka }}
        # ── 9. Create Kafka topics ────────────────────────────────────────────
        # Topics are NOT auto-created by the broker (autoCreateTopicsEnable: false).
        # This init container creates all required topics idempotently.
        - name: create-kafka-topics
          image: "{{ if .Values.kafkaConfig.enabled }}bitnami/kafka:latest{{ else }}confluentinc/cp-kafka:{{ .Values.kafkaConfig.internal.image.tag | default "7.7.1" }}{{ end }}"
          command:
            - sh
            - -c
            - |
              KAFKA_BROKER="{{ include "flexprice.kafkaBrokers" . }}"
              echo "Creating Kafka topics on ${KAFKA_BROKER}..."

              # cp-kafka uses /usr/bin/kafka-topics; bitnami uses kafka-topics.sh
              KAFKA_TOPICS_CMD="kafka-topics"
              if command -v kafka-topics.sh >/dev/null 2>&1; then
                KAFKA_TOPICS_CMD="kafka-topics.sh"
              fi

              # Helper: create topic if it does not exist
              create_topic() {
                TOPIC=$1
                PARTITIONS=${2:-1}
                REPLICATION=${3:-1}
                echo "→ Creating topic: ${TOPIC} (partitions=${PARTITIONS}, replication=${REPLICATION})"
                $KAFKA_TOPICS_CMD --bootstrap-server "${KAFKA_BROKER}" \
                  --create --if-not-exists \
                  --topic "${TOPIC}" \
                  --partitions "${PARTITIONS}" \
                  --replication-factor "${REPLICATION}" || true
              }

              # All topics used by FlexPrice
              create_topic "{{ .Values.kafkaConfig.topic }}"
              create_topic "{{ .Values.kafkaConfig.topicLazy }}"
              create_topic "{{ .Values.kafkaConfig.topicDLQ | default "events_dlq" }}"
              create_topic "{{ .Values.eventPostProcessing.topic }}"
              create_topic "{{ .Values.eventPostProcessing.topicBackfill }}"
              create_topic "{{ .Values.webhook.topic }}"
              create_topic "events_backfill"
              create_topic "wallet_alert"
              create_topic "onboarding_events"

              echo "✅ Kafka topics ready"
              $KAFKA_TOPICS_CMD --bootstrap-server "${KAFKA_BROKER}" --list
          resources:
            limits:
              cpu: "200m"
              memory: "256Mi"
            requests:
              cpu: "100m"
              memory: "128Mi"
        {{- end }}

      containers:
        # ── Main: all migration steps handled by init containers ──────────────
        - name: migration
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.migration.command }}
          command:
            - /bin/sh
            - -c
            - {{ .Values.migration.command | quote }}
          {{- else }}
          command:
            - /bin/sh
            - -c
            - |
              echo "=========================================="
              echo "✅ All migrations completed successfully!"
              echo "=========================================="
          {{- end }}
          env:
            {{- include "flexprice.env" . | nindent 12 }}
          volumeMounts:
            {{- if not .Values.env }}
            - name: config
              mountPath: /app/config/config.yaml
              subPath: config.yaml
              readOnly: true
            {{- end }}
            - name: tools
              mountPath: /tools
            {{- include "flexprice.kafkaTLSVolumeMounts" . | nindent 12 }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.migration.resources | nindent 12 }}

      volumes:
        {{- if not .Values.env }}
        - name: config
          configMap:
            name: {{ include "flexprice.fullname" . }}-config
        {{- end }}
        - name: tools
          emptyDir: {}
        {{- include "flexprice.kafkaTLSVolume" . | nindent 8 }}
        {{- /* The `migrations` emptyDir is gone: it existed only to hand *.sql
               files from a copy container to a clickhouse-client container.
               The ClickHouse step now runs the migrate binary from the
               flexprice image, which reads them from /app directly. */}}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
