{{- if .Values.adot.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "flexprice.fullname" . }}-adot-collector
  labels:
    {{- include "flexprice.labels" . | nindent 4 }}
    app.kubernetes.io/component: adot-collector
spec:
  replicas: {{ .Values.adot.replicaCount }}
  selector:
    matchLabels:
      {{- include "flexprice.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: adot-collector
  template:
    metadata:
      labels:
        {{- include "flexprice.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: adot-collector
      annotations:
        checksum/config: {{ include "flexprice.fullname" . }}-{{ .Values.adot.region }}
    spec:
      serviceAccountName: {{ .Values.adot.serviceAccount.name }}
      containers:
        - name: adot-collector
          image: "{{ .Values.adot.image.repository }}@{{ .Values.adot.image.digest }}"
          args: ["--config=/etc/otel/collector.yaml"]
          ports:
            - { name: otlp-grpc, containerPort: 4317 }
            - { name: otlp-http, containerPort: 4318 }
            - { name: health,    containerPort: 13133 }
          livenessProbe:
            httpGet: { path: /, port: 13133 }
            initialDelaySeconds: 10
          readinessProbe:
            httpGet: { path: /, port: 13133 }
            initialDelaySeconds: 5
          resources:
            {{- toYaml .Values.adot.resources | nindent 12 }}
          volumeMounts:
            - { name: config, mountPath: /etc/otel }
      volumes:
        - name: config
          configMap:
            name: {{ include "flexprice.fullname" . }}-adot-config
{{- end }}
