{{- if and .Values.adot.enabled .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "flexprice.fullname" . }}-adot-collector
  labels:
    {{- include "flexprice.labels" . | nindent 4 }}
    app.kubernetes.io/component: adot-collector
spec:
  podSelector:
    matchLabels:
      {{- include "flexprice.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: adot-collector
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "flexprice.selectorLabels" . | nindent 14 }}
      ports:
        - { protocol: TCP, port: 4317 }
        - { protocol: TCP, port: 4318 }
{{- end }}
