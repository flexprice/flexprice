{{- if .Values.adot.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "flexprice.fullname" . }}-adot-collector
  labels:
    {{- include "flexprice.labels" . | nindent 4 }}
    app.kubernetes.io/component: adot-collector
spec:
  type: ClusterIP
  selector:
    {{- include "flexprice.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: adot-collector
  ports:
    - { name: otlp-grpc, port: 4317, targetPort: 4317 }
    - { name: otlp-http, port: 4318, targetPort: 4318 }
{{- end }}
