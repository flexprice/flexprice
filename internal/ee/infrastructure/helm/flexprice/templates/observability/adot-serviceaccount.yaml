{{- if and .Values.adot.enabled .Values.adot.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.adot.serviceAccount.name }}
  labels:
    {{- include "flexprice.labels" . | nindent 4 }}
    app.kubernetes.io/component: adot-collector
  {{- with .Values.adot.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
