{{- if and .Values.e2eprobeV2.enabled .Values.e2eprobeV2.bootstrap.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "flexprice.fullname" . }}-e2eprobe-v2-bootstrap
  labels:
    {{- include "flexprice.componentLabels" (dict "ctx" . "component" "e2eprobe-v2") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "flexprice.fullname" . }}-e2eprobe-v2-bootstrap
subjects:
  - kind: ServiceAccount
    name: {{ include "flexprice.fullname" . }}-e2eprobe-v2
    namespace: {{ .Release.Namespace }}
{{- end }}
