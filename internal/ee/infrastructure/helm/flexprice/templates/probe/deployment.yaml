{{- if .Values.e2eprobe.enabled }}
# e2eprobe — the suite-driven synthetic probe (internal/ee/e2eprobe).
# It runs beside the previous generation (templates/probe) until that one is
# retired; give it its own API key, secret and, ideally, environment.
#
# Single replica by design: the ledger that predicts every usage total assumes
# one sender, and personas are provisioned by one process. `maxSurge: 0`
# preserves that across deploys — never raise replicas or maxSurge above 0.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "flexprice.fullname" . }}-e2eprobe
  labels:
    {{- include "flexprice.componentLabels" (dict "ctx" . "component" "e2eprobe") | nindent 4 }}
spec:
  # Hardcoded, NOT configurable: a second sender breaks the oracle's exact totals.
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "flexprice.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: e2eprobe
  template:
    metadata:
      labels:
        {{- include "flexprice.componentPodLabels" (dict "ctx" . "component" "e2eprobe") | nindent 8 }}
      {{- if .Values.e2eprobe.suite }}
      annotations:
        # The suite is read once at startup; a changed ConfigMap must roll the pod.
        checksum/suite: {{ include (print $.Template.BasePath "/probe/configmap-suite.yaml") . | sha256sum }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- /*
        Dedicated ServiceAccount; its token is mounted only for bootstrap.

        Without a dedicated SA the pod runs as the namespace `default` one and
        Kubernetes mounts its token, so a compromised probe image could reach
        the Kubernetes API with whatever the default SA is granted — on top of
        the probe's own API key and Slack webhook, which are mounted as env.

        With bootstrap disabled the probe talks only to the flexprice API over
        HTTPS and needs no cluster access, so no token is mounted — on either
        the ServiceAccount or the pod.

        With bootstrap enabled the probe must persist the API key it mints, so
        a token is mounted and a Role grants get+patch on exactly one Secret,
        by name. That Secret carries only the bootstrap output, so the added
        exposure over the credentials already mounted as env is negligible.

        Both this and the ServiceAccount-level flag in service.yaml must agree:
        either one set to false leaves the pod without a token.
      */}}
      serviceAccountName: {{ include "flexprice.fullname" . }}-e2eprobe
      automountServiceAccountToken: {{ .Values.e2eprobe.bootstrap.enabled }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: e2eprobe
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- /*
            Tag falls back to the chart's appVersion rather than a mutable
            floating tag, and pullPolicy defaults to IfNotPresent. A default of
            `develop` + `Always` means every enabling operator continuously
            re-pulls a mutable reference into production, so a compromised push
            to that tag reaches the cluster with access to the mounted probe
            secrets and the pod's ServiceAccount token. Pin a tag or digest per
            region instead.
          */}}
          image: "{{ .Values.e2eprobe.image.repository }}:{{ .Values.e2eprobe.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.e2eprobe.image.pullPolicy | default "IfNotPresent" }}
          workingDir: /app
          ports:
            - name: webhook
              containerPort: {{ .Values.e2eprobe.service.port }}
              protocol: TCP
          env:
            {{- /*
              Custom env is rendered FIRST so the reserved names below always
              win. Kubernetes resolves a duplicated env name to the LAST
              occurrence, so rendering .Values.e2eprobe.env after these would
              let a values entry named E2EPROBE_API_KEY silently replace the
              secret-backed credential with a plaintext literal — the probe
              would keep running, authenticating with the wrong key.
              Reserved: E2EPROBE_API_KEY, E2EPROBE_SLACK_WEBHOOK_URL,
              E2EPROBE_WEBHOOK_TOKEN, E2EPROBE_SUITE_FILE, E2EPROBE_STATE_FILE,
              E2EPROBE_LISTENER_PORT, TMPDIR, E2EPROBE_EMAIL, E2EPROBE_PASSWORD.

              The credentials are reserved for the same reason as the key, and
              more sharply: e2eprobe.env values are plaintext in the rendered
              manifest, so a password set there would be readable by anyone who
              can view the release.
            */}}
            {{- $reserved := list "E2EPROBE_API_KEY" "E2EPROBE_SLACK_WEBHOOK_URL" "E2EPROBE_WEBHOOK_TOKEN" "E2EPROBE_SUITE_FILE" "E2EPROBE_STATE_FILE" "E2EPROBE_LISTENER_PORT" "TMPDIR" "E2EPROBE_EMAIL" "E2EPROBE_PASSWORD" }}
            {{- range $k, $v := .Values.e2eprobe.env }}
            {{- if has $k $reserved }}
            {{- fail (printf "e2eprobe.env may not set %s — it is managed by the chart (reserved: %s)" $k (join ", " $reserved)) }}
            {{- end }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            - name: E2EPROBE_API_KEY
              valueFrom:
                secretKeyRef:
                  {{- if .Values.e2eprobe.bootstrap.enabled }}
                  {{- /*
                    Bootstrap writes the key here, so this is where it is read
                    back from on later boots. optional: true is what lets the
                    very first pod start while the value is still empty.
                  */}}
                  name: {{ .Values.e2eprobe.bootstrap.secretName }}
                  key: {{ .Values.e2eprobe.bootstrap.secretKey }}
                  optional: true
                  {{- else }}
                  name: {{ .Values.e2eprobe.existingSecret }}
                  key: {{ .Values.e2eprobe.secretKeys.apiKey }}
                  {{- end }}
            {{- if .Values.e2eprobe.bootstrap.enabled }}
            - name: E2EPROBE_EMAIL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.e2eprobe.bootstrap.existingCredentialsSecret }}
                  key: {{ .Values.e2eprobe.bootstrap.emailKey }}
            - name: E2EPROBE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.e2eprobe.bootstrap.existingCredentialsSecret }}
                  key: {{ .Values.e2eprobe.bootstrap.passwordKey }}
            - name: E2EPROBE_BOOTSTRAP_SECRET_NAME
              value: {{ .Values.e2eprobe.bootstrap.secretName | quote }}
            - name: E2EPROBE_BOOTSTRAP_SECRET_KEY
              value: {{ .Values.e2eprobe.bootstrap.secretKey | quote }}
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- end }}
            - name: E2EPROBE_SLACK_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.e2eprobe.existingSecret }}
                  key: {{ .Values.e2eprobe.secretKeys.slackWebhookUrl }}
                  {{- /*
                    Optional so a bootstrap-only deployment need not also carry
                    e2eprobe.existingSecret. Without this the pod fails to start
                    with `secret "e2eprobe-secrets" not found` even though the
                    probe treats an empty webhook as "Slack disabled" — which
                    cost a debugging cycle on a real cluster.
                  */}}
                  optional: true
            {{- /*
              Optional shared secret the inbox requires on every webhook post.
              Set the same value as a header on the tenant's webhook endpoint
              (X-E2EProbe-Token) so foreign posts are rejected with 401.
            */}}
            - name: E2EPROBE_WEBHOOK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.e2eprobe.existingSecret }}
                  key: {{ .Values.e2eprobe.secretKeys.webhookToken }}
                  optional: true
            {{- if .Values.e2eprobe.suite }}
            - name: E2EPROBE_SUITE_FILE
              value: "/etc/e2eprobe/suite.yaml"
            {{- end }}
            - name: E2EPROBE_STATE_FILE
              value: {{ ternary "/var/lib/e2eprobe/state.json" "/tmp/e2eprobe-state.json" .Values.e2eprobe.state.persistence.enabled | quote }}
            - name: E2EPROBE_LISTENER_PORT
              value: {{ .Values.e2eprobe.service.port | quote }}
            - name: TMPDIR
              value: "/tmp"
          # /healthz is served once the listener is up, which comes after the
          # signup bootstrap; the startup probe gives that path ten minutes
          # before liveness takes over and restarts a wedged process.
          startupProbe:
            httpGet:
              path: /healthz
              port: webhook
            periodSeconds: 10
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /healthz
              port: webhook
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: webhook
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            {{- toYaml .Values.e2eprobe.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if .Values.e2eprobe.state.persistence.enabled }}
            - name: state
              mountPath: /var/lib/e2eprobe
            {{- end }}
            {{- if .Values.e2eprobe.suite }}
            - name: suite
              mountPath: /etc/e2eprobe
              readOnly: true
            {{- end }}
      volumes:
        # Holds the incident snapshot between container restarts unless the
        # state volume below is enabled; a rescheduled pod then starts clean and
        # re-derives open incidents within a few runs.
        - name: tmp
          emptyDir: {}
        {{- if .Values.e2eprobe.state.persistence.enabled }}
        - name: state
          persistentVolumeClaim:
            claimName: {{ include "flexprice.fullname" . }}-e2eprobe-state
        {{- end }}
        {{- if .Values.e2eprobe.suite }}
        - name: suite
          configMap:
            name: {{ include "flexprice.fullname" . }}-e2eprobe-suite
        {{- end }}
      {{- with (default .Values.nodeSelector .Values.e2eprobe.nodeSelector) }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (default .Values.tolerations .Values.e2eprobe.tolerations) }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
