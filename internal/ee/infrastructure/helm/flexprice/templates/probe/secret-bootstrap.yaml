{{- if and .Values.e2eprobe.enabled .Values.e2eprobe.bootstrap.enabled }}
{{- $name := .Values.e2eprobe.bootstrap.secretName }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name) }}
# Holds ONLY the bootstrap output. The probe has write access to this object,
# so it must never also carry the Slack webhook or any other credential — keep
# it separate from e2eprobe.existingSecret.
#
# The empty default is rendered only when the Secret does not exist yet.
# helm.sh/resource-policy: keep governs deletion (uninstall, or the resource
# leaving the release), NOT upgrade: on upgrade Helm would re-render an
# explicitly declared empty value and wipe the stored key. The lookup guard is
# what actually preserves it. lookup returns nothing under `helm template` and
# `--dry-run`, so the empty default appears there — that is expected.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "flexprice.componentLabels" (dict "ctx" . "component" "e2eprobe") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
{{- if not $existing }}
stringData:
  {{ .Values.e2eprobe.bootstrap.secretKey }}: ""
  secret-id: ""
{{- end }}
{{- end }}
