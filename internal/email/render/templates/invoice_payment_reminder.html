{{define "body"}}
<tr><td style="background:#ffffff;border:1px solid #e8e8e8;border-radius:14px;padding:22px;font-size:15px;line-height:24px;">
{{- range .Paragraphs}}
<p style="margin:0 0 14px;">{{range $i, $line := .}}{{if $i}}<br>{{end}}{{$line}}{{end}}</p>
{{- end}}
{{- if .ViewURL}}
<a href="{{.ViewURL}}" style="display:block;background:#0f2a3d;color:#ffffff;text-decoration:none;text-align:center;font-size:15px;font-weight:500;padding:12px 16px;border-radius:8px;margin-top:20px;">View invoice</a>
{{- else if .PDFAttached}}
<p style="margin:18px 0 0;font-size:14px;color:#6b6b6b;">The invoice PDF is attached.</p>
{{- else if .PDFURL}}
<p style="margin:18px 0 0;font-size:14px;color:#6b6b6b;">Invoice PDF: <a href="{{.PDFURL}}" style="color:#0f2a3d;">{{.PDFURL}}</a></p>
{{- end}}
</td></tr>
{{end}}
