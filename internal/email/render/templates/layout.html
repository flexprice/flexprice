{{define "layout"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>{{.Merchant}}</title>
</head>
<body style="margin:0;padding:0;background:#f4f4f4;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#f4f4f4;">
<tr><td align="center" style="padding:32px 12px;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:560px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;color:#0a0a0a;">
<tr><td style="padding:0 2px 16px;font-size:18px;font-weight:500;">{{.Merchant}}</td></tr>
{{template "body" .}}
<tr><td style="padding:20px 4px 0;font-size:13px;line-height:22px;color:#6b6b6b;">
{{- if .ContactEmail}}Contact {{.Merchant}} at <span style="color:#0a0a0a;">{{.ContactEmail}}</span><br>{{end -}}
Powered by <span style="color:#0a0a0a;">Flexprice</span>
</td></tr>
</table>
</td></tr>
</table>
</body>
</html>
{{end}}
